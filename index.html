<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#04070f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Gym Tracker</title>
<style>
  :root {
    --bg: #04070f;
    --card: #0a1220;
    --card2: #101b2d;
    --border: rgba(94, 200, 255, 0.22);
    --border-strong: rgba(94, 200, 255, 0.45);
    --text: #e9f4ff;
    --muted: #8298b3;
    --accent: #4fd8ff;
    --accent2: #8b5cff;
    --gold: #ffcc55;
    --red: #ff5a6e;
    --radius: 6px;
    --grad: linear-gradient(120deg, #4fd8ff 0%, #7b6cff 100%);
    --glow: rgba(79, 216, 255, 0.32);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { background: var(--bg); }
  body {
    background:
      radial-gradient(1000px 620px at 82% -12%, rgba(79, 216, 255, 0.11), transparent 62%),
      radial-gradient(820px 620px at -12% 18%, rgba(139, 92, 255, 0.11), transparent 62%),
      linear-gradient(rgba(94, 200, 255, 0.032) 1px, transparent 1px) 0 0 / 100% 40px,
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    overscroll-behavior: none;
    overflow-x: hidden;
  }
  /* feine Scanlines – gibt dem Ganzen den Systemfenster-Look */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 300;
    background: repeating-linear-gradient(180deg, rgba(180, 230, 255, 0.025) 0 1px, transparent 1px 3px);
  }

  /* ---------- Animationen ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes slideUp {
    from { transform: translateY(48px); opacity: 0.4; }
    to   { transform: none; opacity: 1; }
  }
  @keyframes sysPop {
    0%   { transform: scale(0.9); opacity: 0; filter: brightness(2.2); }
    55%  { transform: scale(1.015); opacity: 1; filter: brightness(1.25); }
    100% { transform: scale(1); opacity: 1; filter: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes bounceIn {
    0%   { transform: scale(0) rotate(-20deg); }
    60%  { transform: scale(1.18) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes sweep {
    from { transform: translateY(-100%); opacity: 0.7; }
    to   { transform: translateY(400%); opacity: 0; }
  }
  main.anim > * { animation: rise 0.4s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
  main.anim > *:nth-child(2) { animation-delay: 0.04s; }
  main.anim > *:nth-child(3) { animation-delay: 0.08s; }
  main.anim > *:nth-child(4) { animation-delay: 0.12s; }
  main.anim > *:nth-child(5) { animation-delay: 0.16s; }
  main.anim > *:nth-child(n+6) { animation-delay: 0.2s; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    body::after { display: none; }
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    padding: 16px 16px calc(84px + env(safe-area-inset-bottom));
    padding-top: calc(16px + env(safe-area-inset-top));
  }

  /* ---------- Überschriften im System-Stil ---------- */
  h1 {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .sys-h {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
  }
  .sys-h::before {
    content: "";
    width: 14px; height: 1px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .head-block { position: relative; }
  .deco-kana {
    position: absolute;
    top: -4px; right: 0;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    opacity: 0.28;
    font-family: var(--mono);
    pointer-events: none;
  }

  /* ---------- Tab-Bar ---------- */
  nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    background: linear-gradient(180deg, rgba(10, 18, 32, 0.96), rgba(4, 7, 15, 0.98));
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 50;
  }
  nav button {
    position: relative;
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 11px 0 9px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: inherit;
  }
  nav button .icon { font-size: 21px; line-height: 1; transition: transform 0.2s cubic-bezier(0.3, 1.4, 0.4, 1); }
  nav button.active { color: var(--accent); }
  nav button.active .icon { transform: translateY(-2px) scale(1.12); }
  nav button.active::before {
    content: "";
    position: absolute;
    top: -1px; left: 24%; right: 24%;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }

  /* ---------- Karten = Statusfenster ---------- */
  .card {
    position: relative;
    background:
      linear-gradient(90deg, transparent, rgba(79, 216, 255, 0.5) 25%, rgba(139, 92, 255, 0.5) 75%, transparent) top left / 100% 1px no-repeat,
      linear-gradient(180deg, rgba(79, 216, 255, 0.055), transparent 45%),
      var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 9px; height: 9px;
    border: 1.5px solid var(--accent);
    opacity: 0.65;
    pointer-events: none;
  }
  .card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  /* ---------- Buttons ---------- */
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 0.06em;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .btn:active { transform: scale(0.965); filter: brightness(1.15); }
  .btn-primary {
    background: var(--grad);
    color: #03121c;
    font-weight: 800;
    text-transform: uppercase;
    box-shadow: 0 8px 26px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .btn-secondary {
    background: linear-gradient(180deg, rgba(79, 216, 255, 0.09), rgba(79, 216, 255, 0.02));
    color: var(--text);
    border: 1px solid var(--border-strong);
    text-transform: uppercase;
    font-size: 15px;
  }
  .btn-danger {
    background: linear-gradient(135deg, #ff7a86, #d92b40);
    color: #fff;
    text-transform: uppercase;
    box-shadow: 0 6px 18px rgba(255, 90, 110, 0.28);
  }
  .btn-ghost {
    background: none;
    color: var(--accent);
    font-size: 14px;
    letter-spacing: 0.08em;
    padding: 12px;
  }

  /* ---------- Aktives Training ---------- */
  .workout-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .timer {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: var(--accent);
    font-weight: 700;
    background: rgba(79, 216, 255, 0.1);
    border: 1px solid var(--border-strong);
    padding: 6px 13px;
    border-radius: 4px;
  }
  .timer::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .exercise-card { padding: 14px 14px 10px; }
  .exercise-title {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .ex-title-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .ex-title-left > span { min-width: 0; overflow-wrap: anywhere; }
  .ex-actions { display: flex; flex-shrink: 0; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 6px 7px;
    font-family: inherit;
  }
  .icon-btn:active { color: var(--accent); }
  .ex-thumb {
    width: 44px; height: 44px;
    border-radius: 4px;
    object-fit: cover;
    border: 1px solid var(--border-strong);
    cursor: pointer;
    flex-shrink: 0;
    display: block;
  }
  .ex-photo-btn {
    width: 44px; height: 44px;
    border-radius: 4px;
    background: var(--card2);
    border: 1px dashed var(--border-strong);
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .photo-viewer {
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 14px;
    width: 100%;
    max-width: 340px;
    animation: sysPop 0.3s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  .photo-viewer img { width: 100%; border-radius: 4px; display: block; }

  /* ---------- Notizen ---------- */
  .note {
    display: flex;
    gap: 7px;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.45;
    border-radius: 4px;
    padding: 8px 10px;
    margin: 8px 0 4px;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  .note-ex {
    color: var(--gold);
    background: rgba(255, 204, 85, 0.07);
    border: 1px solid rgba(255, 204, 85, 0.28);
    border-left: 3px solid var(--gold);
  }
  .note-day {
    color: var(--accent);
    background: rgba(79, 216, 255, 0.06);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note.empty {
    color: var(--muted);
    background: none;
    border: 1px dashed var(--border);
    border-left: 1px dashed var(--border);
    font-size: 13px;
  }
  .note-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.4; }

  .last-time { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .last-time strong { color: var(--text); font-weight: 600; }
  .recommend {
    font-size: 13.5px;
    color: var(--text);
    background: linear-gradient(90deg, rgba(79, 216, 255, 0.13), rgba(79, 216, 255, 0.03));
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 9px 11px;
    margin-bottom: 10px;
    line-height: 1.45;
  }
  .rec-head {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 3px;
  }
  .recommend strong { color: var(--accent); }
  .rec-why { color: var(--muted); font-size: 12.5px; }

  .template-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 10px 12px 16px;
    cursor: pointer;
  }
  .tpl-info { min-width: 0; }
  .tpl-names { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .backup-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
  }
  .btn-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
    padding: 6px;
  }

  .sets { --cols: 30px 1fr 13px 1fr 34px 26px; }
  .sets.with-rpe { --cols: 28px 1fr 11px 1fr 42px 32px 24px; }
  .set-row, .set-labels {
    display: grid;
    grid-template-columns: var(--cols);
    gap: 6px;
    align-items: center;
  }
  .set-row { margin-bottom: 8px; }
  .set-num {
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    padding: 8px 0;
    cursor: pointer;
  }
  .set-row.is-warmup .set-num {
    color: var(--gold);
    border-color: rgba(255, 204, 85, 0.4);
    background: rgba(255, 204, 85, 0.08);
  }
  .set-row.is-warmup input { border-style: dashed; }
  .set-row input {
    width: 100%;
    min-width: 0;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 10px 2px;
    font-family: inherit;
  }
  .set-row input::placeholder { color: var(--muted); opacity: 0.55; font-weight: 500; }
  .set-row input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(79, 216, 255, 0.25), 0 0 14px rgba(79, 216, 255, 0.2);
  }
  .set-row.is-done input {
    border-color: rgba(79, 216, 255, 0.45);
    background: rgba(79, 216, 255, 0.09);
  }
  .set-rpe { font-size: 15px !important; }
  .set-x { color: var(--muted); text-align: center; font-size: 13px; }
  .set-check {
    background: none;
    border: 1.5px solid var(--border-strong);
    border-radius: 4px;
    color: transparent;
    font-size: 15px;
    line-height: 1;
    padding: 9px 0;
    cursor: pointer;
    font-family: inherit;
  }
  .set-row.is-done .set-check {
    background: var(--accent);
    border-color: var(--accent);
    color: #03121c;
    box-shadow: 0 0 14px var(--glow);
  }
  .set-del {
    background: none; border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    padding: 6px 0;
  }
  .set-labels {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
  }
  .set-labels span { text-align: center; }
  .set-hint {
    font-size: 11.5px;
    color: var(--muted);
    opacity: 0.75;
    margin: 2px 0 6px;
  }

  /* ---------- Ziel-Vorgabe & Supersatz ---------- */
  .target-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    cursor: pointer;
  }
  .target-line b { color: var(--accent); font-weight: 700; }
  .target-line .prog { margin-left: auto; color: var(--accent); }
  .superset {
    position: relative;
    border-left: 2px solid var(--accent2);
    padding-left: 8px;
    margin-bottom: 12px;
  }
  .superset > .card { margin-bottom: 8px; }
  .superset > .card:last-of-type { margin-bottom: 0; }
  .superset-tag {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 6px;
  }

  /* ---------- Pausentimer ---------- */
  .rest-bar {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(57px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    z-index: 60;
    background: linear-gradient(180deg, rgba(12, 22, 38, 0.98), rgba(5, 9, 18, 0.98));
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--accent);
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5), 0 0 24px rgba(79, 216, 255, 0.14);
    padding: 10px 14px 12px;
    animation: slideUp 0.25s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  .rest-bar[hidden] { display: none; }
  .rest-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .rest-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .rest-time {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
    text-shadow: 0 0 16px var(--glow);
  }
  .rest-track {
    height: 3px;
    background: rgba(79, 216, 255, 0.15);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 9px;
  }
  .rest-fill {
    height: 100%;
    background: var(--grad);
    box-shadow: 0 0 12px var(--glow);
    transition: width 0.3s linear;
  }
  .rest-btns { display: flex; gap: 8px; }
  .rest-btns button {
    flex: 1;
    background: rgba(79, 216, 255, 0.08);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 9px 0;
    cursor: pointer;
  }
  .rest-btns button:active { background: rgba(79, 216, 255, 0.2); }
  body.has-rest nav { box-shadow: none; }

  /* ---------- Aktionsblatt & Formularzeilen ---------- */
  .sheet-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    padding: 14px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .sheet-btn:last-child { border-bottom: none; }
  .sheet-btn .sb-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .sheet-btn.danger { color: var(--red); }
  .sheet-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .field { margin-bottom: 16px; }
  .field-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    flex: 1;
    min-width: 44px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 4px;
    cursor: pointer;
  }
  .seg button.on {
    background: rgba(79, 216, 255, 0.14);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
    box-shadow: 0 0 14px rgba(79, 216, 255, 0.15);
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    font-size: 13px;
    padding: 7px 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .chips button.on {
    background: rgba(139, 92, 255, 0.16);
    border-color: var(--accent2);
    color: #cbb6ff;
    font-weight: 600;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
  }
  .toggle-row:last-of-type { border-bottom: none; }

<div id="app">
  <main id="main"></main>
  <div class="rest-bar" id="rest-bar" hidden>

      <span class="rest-label">Pause</span>

    <div class="rest-btns">
      <button onclick="adjustRest(-15)">−15 s</button>

      <button onclick="stopRest()">Überspringen</button>
    </div>
  </div>
  <nav id="nav">
    <button data-tab="home"><span class="icon">🏋️</span>Training</button>
    <button data-tab="plan"><span class="icon">🗓️</span>Plan</button>
    <button data-tab="history"><span class="icon">📅</span>Verlauf</button>
    <button data-tab="progress"><span class="icon">📈</span>Fortschritt</button>
  </nav>
</div>
<input type="file" id="photo-input" accept="image/*" hidden>
<input type="file" id="import-input" accept=".json,application/json" hidden>

<script>
"use strict";

/* ============ Daten ============ */
const STORAGE_KEY = "gymtracker-v1";
const SAFETY_KEY = "gymtracker-v1-pre-v2";   // unangetastete Kopie vor der ersten Migration
const DATA_VERSION = 2;
const TPL_COLORS = ["#4fd8ff", "#8b5cff", "#ffcc55", "#ff6ec7", "#45e6a0", "#ff9a4f"];

let state = load();

// Migration: ausschließlich additiv. Es wird nie ein Feld gelöscht oder überschrieben,
// nur fehlende Felder werden ergänzt. Alte Backups bleiben dadurch importierbar.
function migrate(data) {
  if (!data || typeof data !== "object") return data;
  data.exercises = data.exercises || [];
  data.workouts = data.workouts || [];
  data.templates = data.templates || [];
  data.settings = Object.assign(
    { restSeconds: 90, sound: true, vibrate: true, autoRest: true, showRpe: false, defaultSets: 3 },
    data.settings || {});
  data.plan = data.plan || { days: {} };
  data.plan.days = data.plan.days || {};
  data.templates.forEach((t, i) => {
    if (!t.color) t.color = TPL_COLORS[i % TPL_COLORS.length];
    t.exerciseIds = t.exerciseIds || [];
  });
  data.workouts.forEach(w => {
    if (!w.type) w.type = "strength";
    (w.entries || []).forEach(e => { e.sets = e.sets || []; });
  });
  if (data.active) {
    if (!data.active.type) data.active.type = "strength";
    (data.active.entries || []).forEach(e => { e.sets = e.sets || []; });
  }
  data.version = DATA_VERSION;
  return data;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      // Sicherheitsnetz: einmalig den Stand vor der Migration wegsichern
      if (!data.version && !localStorage.getItem(SAFETY_KEY)) {
        try { localStorage.setItem(SAFETY_KEY, raw); } catch (e) { /* Speicher voll – dann eben ohne */ }
      }
      // Früher gab es eine vorgefüllte Übungsliste — nie benutzte Einträge daraus entfernen
      const used = new Set();
      (data.workouts || []).forEach(w => (w.entries || []).forEach(e => used.add(e.exerciseId)));
      if (data.active) (data.active.entries || []).forEach(e => used.add(e.exerciseId));
      data.exercises = (data.exercises || []).filter(e => !/^ex\d+$/.test(e.id) || used.has(e.id));
      return migrate(data);
    }
  } catch (e) { /* beschädigte Daten → neu anfangen */ }
  return migrate({ exercises: [], workouts: [], templates: [], active: null });
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ============ Hilfsfunktionen ============ */
function exercise(id) {
  return state.exercises.find(e => e.id === id) || null;
}

function exName(id) {
  const ex = exercise(id);
  return ex ? ex.name : "Unbekannt";
}

function exNote(id) {
  const ex = exercise(id);
  return ex && ex.note ? ex.note : "";
}

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString("de-DE", {
    weekday: "short", day: "numeric", month: "long"
  });
}

function fmtDateShort(ts) {
  return new Date(ts).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" });
}

function fmtDuration(ms) {
  const totalMin = Math.round(ms / 60000);
  if (totalMin < 60) return totalMin + " Min.";
  return Math.floor(totalMin / 60) + " Std. " + (totalMin % 60) + " Min.";
}

function fmtWeight(w) {
  return (w % 1 === 0 ? w : w.toFixed(1).replace(".", ",")) + " kg";
}

function setsSummary(sets, marks = false) {
  return (sets || []).map(s => {
    let t = `${String(s.weight).replace(".", ",")} kg × ${s.reps}`;
    if (marks) {
      if (s.warmup) t = "🔸" + t;
      if (typeof s.rpe === "number") t += ` @${fmtNum(s.rpe)}`;
    }
    return t;
  }).join("  ·  ");
}

// Aufwärmsätze zählen nirgends mit: nicht bei Rekorden, nicht im Volumen,
// nicht in der Empfehlung.
function workSets(sets) {
  return (sets || []).filter(s => !s.warmup);
}

function setVolume(sets) {
  return workSets(sets).reduce((v, s) => v + s.weight * s.reps, 0);
}

// Geschätztes Einer-Maximum nach Epley
function epley(weight, reps) {
  if (!weight || !reps) return 0;
  return weight * (1 + reps / 30);
}

function targetOf(exerciseId) {
  const ex = exercise(exerciseId) || {};
  return {
    sets: ex.targetSets || state.settings.defaultSets || 3,
    min: ex.repMin || 8,
    max: ex.repMax || 12
  };
}

// Letzte Leistung für eine Übung aus abgeschlossenen Trainings finden
function lastPerformance(exerciseId) {
  const sorted = [...state.workouts].sort((a, b) => b.start - a.start);
  for (const w of sorted) {
    const entry = w.entries.find(e => e.exerciseId === exerciseId && workSets(e.sets).length > 0);
    if (entry) return { date: w.start, sets: workSets(entry.sets) };
  }
  return null;
}

// Steigerungs-Empfehlung nach doppelter Progression im eingestellten Ziel-Bereich.
// Alle Sätze am oberen Ende → mehr Gewicht, zurück ans untere Ende.
// Sonst → gleiches Gewicht, eine Wiederholung mehr als der schwächste Satz.
// Wenn RPE erfasst wurde, steuert es die Schrittgröße: locker → größerer Sprung,
// am Anschlag → erst mal halten.
function recommendation(exerciseId) {
  const last = lastPerformance(exerciseId);
  if (!last || !last.sets.length) return null;
  const sets = last.sets;
  const tgt = targetOf(exerciseId);
  const top = sets.reduce((m, s) => s.weight > m.weight ? s : m, sets[0]);
  const minReps = Math.min(...sets.map(s => s.reps));
  const rpes = sets.map(s => s.rpe).filter(r => typeof r === "number");
  const avgRpe = rpes.length ? rpes.reduce((a, b) => a + b, 0) / rpes.length : null;

  if (top.weight === 0) {
    return { text: `${minReps + 1} Wdh. pro Satz`, why: "Körpergewicht – Steigerung über Wiederholungen" };
  }
  if (avgRpe !== null && avgRpe >= 9.5) {
    return {
      text: `${fmtWeight(top.weight)} × ${minReps} Wdh.`,
      why: `letztes Mal RPE ${fmtNum(avgRpe)} – erst sauber wiederholen, dann steigern`
    };
  }
  if (sets.every(s => s.reps >= tgt.max)) {
    const step = (avgRpe !== null && avgRpe <= 7) ? 1.05 : 1.025;
    let nw = Math.ceil((top.weight * step) / 0.5) * 0.5;
    if (nw <= top.weight) nw = top.weight + 0.5;
    const pct = step === 1.05 ? "+5 %" : "+2,5 %";
    const extra = step === 1.05 ? ` und RPE nur ${fmtNum(avgRpe)}` : "";
    return {
      text: `${fmtWeight(nw)} × ${tgt.min} Wdh.`,
      why: `alle Sätze ≥ ${tgt.max} Wdh.${extra} → Zeit für mehr Gewicht (${pct})`
    };
  }
  return {
    text: `${fmtWeight(top.weight)} × ${Math.min(minReps + 1, tgt.max)} Wdh.`,
    why: `gleiches Gewicht, eine Wdh. mehr (Ziel: ${tgt.max})`
  };
}

function fmtNum(n) {
  return (Math.round(n * 10) / 10).toString().replace(".", ",");
}

function fmtCount(n, one, many) {
  return `${n} ${n === 1 ? one : many}`;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

/* ============ Eigene Dialoge (statt Browser-Popups) ============ */
function dialog(message, buttons) {
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop dialog-backdrop";
    backdrop.innerHTML = `<div class="dialog">
      <div class="sys-badge">⟦ System ⟧</div>
      <p>${escapeHtml(message)}</p>
      <div class="dialog-buttons">
        ${buttons.map((b, i) => `<button class="btn ${b.cls}" data-i="${i}">${escapeHtml(b.label)}</button>`).join("")}
      </div>
    </div>`;
    backdrop.addEventListener("click", e => {
      const btn = e.target.closest("button[data-i]");
      if (btn) { backdrop.remove(); resolve(buttons[+btn.dataset.i].value); }
      else if (e.target === backdrop) { backdrop.remove(); resolve(false); }
    });
    document.body.appendChild(backdrop);
  });
}

function showAlert(msg) {
  return dialog(msg, [{ label: "OK", cls: "btn-primary", value: true }]);
}

function showConfirm(msg, okLabel = "Ja", danger = false) {
  return dialog(msg, [
    { label: "Abbrechen", cls: "btn-secondary", value: false },
    { label: okLabel, cls: danger ? "btn-danger" : "btn-primary", value: true }
  ]);
}

// Auflösung: null = abgebrochen, sonst der (ggf. leere) getrimmte Text.
function showPrompt(title, placeholder, value = "", opts = {}) {
  const multiline = !!opts.multiline;
  const hint = opts.hint ? `<p style="font-size:12.5px;color:var(--muted);text-align:left;margin:-4px 0 12px;line-height:1.45">${escapeHtml(opts.hint)}</p>` : "";
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop dialog-backdrop";
    const field = multiline
      ? `<textarea id="prompt-input" rows="4" placeholder="${escapeHtml(placeholder)}"></textarea>`
      : `<input type="text" id="prompt-input" placeholder="${escapeHtml(placeholder)}" autocomplete="off" autocapitalize="sentences">`;
    backdrop.innerHTML = `<div class="dialog">
      <h2>${escapeHtml(title)}</h2>
      ${hint}
      ${field}
      <div class="dialog-buttons">
        <button class="btn btn-secondary" data-v="cancel">Abbrechen</button>
        <button class="btn btn-primary" data-v="ok">Speichern</button>
      </div>
    </div>`;
    const input = backdrop.querySelector("#prompt-input");
    input.value = value || "";
    const done = v => { backdrop.remove(); resolve(v); };
    backdrop.addEventListener("click", e => {
      if (e.target === backdrop) { done(null); return; }
      const v = e.target.dataset ? e.target.dataset.v : null;
      if (v === "cancel") done(null);
      else if (v === "ok") done(input.value.trim());
    });
    if (!multiline) {
      input.addEventListener("keydown", e => { if (e.key === "Enter") done(input.value.trim()); });
    }
    document.body.appendChild(backdrop);
    input.focus();
    if (value) input.setSelectionRange(value.length, value.length);
  });
}

/* ============ Backup: sichern & wiederherstellen ============ */
function buildBackup() {
  const photos = {};
  photoCache.forEach((v, k) => { photos[k] = v; });
  return JSON.stringify({ app: "gym-tracker", version: DATA_VERSION, exported: Date.now(), state, photos });
}

function exportData() {
  const blob = new Blob([buildBackup()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `gym-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function importData() {
  document.getElementById("import-input").click();
}

async function handleImportFile(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "gym-tracker" || !data.state || !Array.isArray(data.state.workouts)) throw new Error("ungültig");
    const when = data.exported ? ` vom ${fmtDateShort(data.exported)}` : "";
    const ok = await showConfirm(
      `Backup${when} laden (${data.state.workouts.length} Training${data.state.workouts.length === 1 ? "" : "s"})? Deine aktuellen Daten werden dabei ersetzt.`,
      "Laden", true);
    if (!ok) return;
    state = migrate(data.state);
    save();
    photoCache.clear();
    Object.entries(data.photos || {}).forEach(([k, v]) => {
      photoCache.set(k, v);
      idbPutPhoto(k, v);
    });
    currentTab = "home";
    render();
    showAlert("Backup erfolgreich geladen ✓");
  } catch (e) {
    showAlert("Diese Datei ist leider kein gültiges Gym-Tracker-Backup.");
  }
}

/* ============ Übungs-Fotos (IndexedDB, da localStorage zu klein) ============ */
let photoDb = null;
const photoCache = new Map();

function openPhotoDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("gymtracker-photos", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("photos");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadPhotos() {
  try {
    photoDb = await openPhotoDb();
    await new Promise(resolve => {
      const cur = photoDb.transaction("photos").objectStore("photos").openCursor();
      cur.onsuccess = e => {
        const c = e.target.result;
        if (c) { photoCache.set(c.key, c.value); c.continue(); }
        else resolve();
      };
      cur.onerror = () => resolve();
    });
    if (photoCache.size) render();
  } catch (e) { /* Fotos sind optional – App läuft auch ohne */ }
}

function idbPutPhoto(key, val) {
  try { photoDb && photoDb.transaction("photos", "readwrite").objectStore("photos").put(val, key); } catch (e) {}
}
function idbDeletePhoto(key) {
  try { photoDb && photoDb.transaction("photos", "readwrite").objectStore("photos").delete(key); } catch (e) {}
}

// Foto verkleinern, damit der Speicher nicht überläuft
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 700;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error("Bild nicht lesbar")); };
    img.src = URL.createObjectURL(file);
  });
}

let photoTarget = null;

function pickPhoto(exerciseId) {
  photoTarget = exerciseId;
  document.getElementById("photo-input").click();
}

async function handlePhotoFile(file) {
  if (!file || !photoTarget) return;
  try {
    const dataUrl = await resizeImage(file);
    photoCache.set(photoTarget, dataUrl);
    idbPutPhoto(photoTarget, dataUrl);
    render();
  } catch (e) {
    showAlert("Das Foto konnte leider nicht verarbeitet werden.");
  }
}

function viewPhoto(exerciseId) {
  const src = photoCache.get(exerciseId);
  if (!src) { pickPhoto(exerciseId); return; }
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop dialog-backdrop";
  backdrop.innerHTML = `<div class="photo-viewer">
    <img src="${src}" alt="${escapeHtml(exName(exerciseId))}">
    <p style="text-align:center;font-weight:700;margin:10px 0 12px">${escapeHtml(exName(exerciseId))}</p>
    <div class="dialog-buttons">
      <button class="btn btn-secondary" data-act="change">Foto ändern</button>
      <button class="btn btn-danger" data-act="del">Löschen</button>
    </div>
  </div>`;
  backdrop.addEventListener("click", async e => {
    const act = e.target.dataset ? e.target.dataset.act : null;
    if (e.target === backdrop) backdrop.remove();
    else if (act === "change") { backdrop.remove(); pickPhoto(exerciseId); }
    else if (act === "del") {
      backdrop.remove();
      if (await showConfirm("Foto wirklich löschen?", "Löschen", true)) {
        photoCache.delete(exerciseId);
        idbDeletePhoto(exerciseId);
        render();
      }
    }
  });
  document.body.appendChild(backdrop);
}

    b.classList.toggle("active", b.dataset.tab === currentTab));

/* ============ Wochenplan: Hilfsfunktionen ============ */
const WD_SHORT = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const WD_LONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];

// 1 = Montag … 7 = Sonntag
function isoDay(ts) {
  const n = new Date(ts).getDay();
  return n === 0 ? 7 : n;
}

function dayKey(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function template(id) {
  return (state.templates || []).find(t => t.id === id) || null;
}

function tplColor(t) {
  return (t && t.color) || "#4fd8ff";
}

function planFor(dayNo) {
  const v = state.plan.days[dayNo];
  if (v === "rest") return { rest: true };
  const t = v ? template(v) : null;
  return t ? { tpl: t } : {};
}

function workoutsOnDay(ts) {
  const k = dayKey(ts);
  return state.workouts.filter(w => dayKey(w.start) === k);
}

// Sommer-/Winterzeit sicher über Date rechnen, nicht über Millisekunden
function startOfWeek(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - (isoDay(d) - 1));
  return d.getTime();
}

function shiftWeeks(ts, n) {
  const d = new Date(ts);
  d.setDate(d.getDate() + n * 7);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function workoutsInWeek(weekStart) {
  const end = shiftWeeks(weekStart, 1);
  return state.workouts.filter(w => w.start >= weekStart && w.start < end);
}

// Wie viele Wochen am Stück wurde trainiert? Die laufende Woche zählt erst mit,
// sobald sie eine Einheit hat – sonst wäre die Serie am Montag immer weg.
function weekStreak() {
  let ws = startOfWeek(Date.now());
  if (!workoutsInWeek(ws).length) ws = shiftWeeks(ws, -1);
  let n = 0;
  while (workoutsInWeek(ws).length) { n++; ws = shiftWeeks(ws, -1); }
  return n;
}

function plannedDaysPerWeek() {
  return [1, 2, 3, 4, 5, 6, 7].filter(d => planFor(d).tpl).length;
}

  if (p.tpl) {

        <div class="today-sub">${escapeHtml(names)}</div>
        ${doneToday ? `<p class="today-sub" style="color:var(--accent)">✓ Heute schon trainiert – noch eine Einheit?</p>` : ""}
        <button class="btn btn-primary" onclick="startFromTemplate('${p.tpl.id}')">Training starten</button>
      </div>`;
  } else if (p.rest) {
    todayHtml = `

  const streakHtml = state.workouts.length ? `
    <div class="streak-row">
      <div class="streak"><div class="streak-val">${weekStreak()}</div><div class="streak-lbl">Wochen Serie</div></div>

      <div class="streak"><div class="streak-val">${state.workouts.length}</div><div class="streak-lbl">Trainings gesamt</div></div>
    </div>` : "";

  const others = (state.templates || []).filter(t => !p.tpl || t.id !== p.tpl.id);
  const othersHtml = others.length ? `
    <div class="sys-h" style="margin:22px 0 6px">Anderes Training</div>
    <div class="card" style="padding:4px 14px">
      ${others.map(t => `
        <div class="tpl-row" onclick="startFromTemplate('${t.id}')">

  const recent = [...state.workouts].sort((a, b) => b.start - a.start).slice(0, 3);

      <div class="field-label">Farbe</div>
      <div class="chips" data-group="color">
        ${TPL_COLORS.map(c => `<button data-val="${c}" class="${c === tplColor(t) ? "on" : ""}"
          style="background:${c}22;border-color:${c === tplColor(t) ? c : "var(--border)"};color:${c}">●</button>`).join("")}
      </div>
    </div>
    <div class="field">
      <div class="field-label">Übungen</div>
      ${exHtml}
    </div>
    <button class="sheet-btn" data-act="add"><span class="sb-icon">＋</span>Übung hinzufügen</button>
    <button class="sheet-btn" data-act="rename"><span class="sb-icon">✏️</span>Umbenennen</button>
    <button class="sheet-btn danger" data-act="del"><span class="sb-icon">✕</span>Trainingstag löschen</button>
  `);

  const reopen = () => { sheet.remove(); save(); render(); openTemplateSheet(id); };

  sheet.addEventListener("click", async e => {
    const col = e.target.closest('[data-group="color"] button');
    if (col) { t.color = col.dataset.val; reopen(); return; }
    const mv = e.target.closest("[data-move]");
    if (mv) {
      const i = +mv.dataset.move, to = i + (+mv.dataset.dir);
      [t.exerciseIds[i], t.exerciseIds[to]] = [t.exerciseIds[to], t.exerciseIds[i]];
      reopen();
      return;
    }
    const rm = e.target.closest("[data-rm]");
    if (rm) { t.exerciseIds.splice(+rm.dataset.rm, 1); reopen(); return; }

    const act = e.target.closest("[data-act]");
    if (!act) return;
    if (act.dataset.act === "add") {
      sheet.remove();
      const exId = await chooseExercise({ title: "Übung hinzufügen", exclude: new Set(t.exerciseIds) });
      if (exId) t.exerciseIds.push(exId);
      save();
      render();
      openTemplateSheet(id);
    } else if (act.dataset.act === "rename") {
      sheet.remove();
      const name = await showPrompt("Trainingstag umbenennen", "Name", t.name);
      if (name) { t.name = name; save(); render(); }
      openTemplateSheet(id);
    } else if (act.dataset.act === "del") {
      sheet.remove();
      await deleteTemplate(id);
    }
  });
}

const PRESETS = {
  ppl: { days: { 1: "Push", 3: "Pull", 5: "Beine" } },
  ou:  { days: { 1: "Oberkörper A", 2: "Unterkörper A", 4: "Oberkörper B", 5: "Unterkörper B" } },
  gk:  { days: { 1: "Ganzkörper A", 3: "Ganzkörper B", 5: "Ganzkörper C" } }
};

async function applyPreset(key) {
  const preset = PRESETS[key];
  if (!preset) return;
  const names = [...new Set(Object.values(preset.days))];
  if (!await showConfirm(
    `Trainingstage ${names.join(", ")} anlegen und auf die Woche verteilen? Die Übungen trägst du danach selbst ein.`,
    "Anlegen")) return;
  const byName = {};
  names.forEach(n => {
    let t = (state.templates || []).find(x => x.name.toLowerCase() === n.toLowerCase());
    if (!t) {
      t = { id: uid(), name: n, color: TPL_COLORS[state.templates.length % TPL_COLORS.length], exerciseIds: [] };
      state.templates.push(t);
    }
    byName[n] = t.id;
  });
  Object.entries(preset.days).forEach(([d, n]) => { state.plan.days[d] = byName[n]; });
  save();
  render();
}

function startWorkout() {
  state.active = { start: Date.now(), type: "strength", entries: [] };
  save();
  render();
}

function startFromTemplate(id) {
  const t = (state.templates || []).find(x => x.id === id);
  if (!t) return;
  state.active = {
    start: Date.now(),
    type: "strength",
    templateId: t.id,
    entries: t.exerciseIds
      .filter(x => state.exercises.some(e => e.id === x && !e.archived))
      .map(x => ({ exerciseId: x, sets: [] }))
  };
  state.active.entries.forEach(fillTargetSets);
  save();
  render();
}

async function deleteTemplate(id) {
  const t = (state.templates || []).find(x => x.id === id);
  if (!t) return;
  if (!await showConfirm(`Trainingstag „${t.name}" löschen? Deine Trainings im Verlauf bleiben erhalten.`, "Löschen", true)) return;
  state.templates = state.templates.filter(x => x.id !== id);
  // aus dem Wochenplan mit entfernen, sonst zeigen Tage ins Leere
  Object.keys(state.plan.days).forEach(d => { if (state.plan.days[d] === id) delete state.plan.days[d]; });
  save();
  render();
}

async function saveAsTemplate() {
  const w = state.active;
  if (!w || !w.entries.length) return;
  const name = await showPrompt("Als Trainingstag speichern", "Name, z. B. Push, Training A");
  if (!name) return;
  state.templates = state.templates || [];
  const existing = state.templates.find(t => t.name.toLowerCase() === name.toLowerCase());
  if (existing) {
    existing.exerciseIds = w.entries.map(e => e.exerciseId);
  } else {
    state.templates.push({
      id: uid(),
      name,
      color: TPL_COLORS[state.templates.length % TPL_COLORS.length],
      exerciseIds: w.entries.map(e => e.exerciseId)
    });
  }
  save();
  showAlert(`„${name}" gespeichert ✓ Im Reiter „Plan" kannst du ihn auf einen Wochentag legen.`);
}

/* ============ Ansicht: Aktives Training ============ */
function exerciseCardHtml(entry, ei) {
  const tgt = targetOf(entry.exerciseId);
  const doneCount = workSets(entry.sets).filter(s => s.done).length;

  const last = lastPerformance(entry.exerciseId);
  const lastHtml = last
    ? `<div class="last-time">Letztes Mal (${fmtDateShort(last.date)}): <strong>${setsSummary(last.sets)}</strong></div>`
    : `<div class="last-time">Erste Aufzeichnung für diese Übung 🎉</div>`;
  const rec = recommendation(entry.exerciseId);
  const recHtml = rec
    ? `<div class="recommend">
         <div class="rec-head">System-Hinweis</div>
         Heute: <strong>${rec.text}</strong><span class="rec-why"> – ${rec.why}</span>
       </div>`
    : "";

  const note = exNote(entry.exerciseId);
  const noteHtml = note
    ? `<div class="note note-ex" onclick="editExerciseNote('${entry.exerciseId}')">📌<span>${escapeHtml(note)}</span></div>`
    : `<button class="note note-ex empty" onclick="editExerciseNote('${entry.exerciseId}')">📌<span>Notiz zur Übung hinzufügen</span></button>`;

  const showRpe = !!state.settings.showRpe;
  let workNo = 0;
  const setsHtml = entry.sets.map((s, si) => {
    if (!s.warmup) workNo++;
    const cls = "set-row" + (s.warmup ? " is-warmup" : "") + (s.done ? " is-done" : "");
    const hintW = typeof s.hintW === "number" ? String(s.hintW).replace(".", ",") : "kg";
    const hintR = typeof s.hintR === "number" ? String(s.hintR) : "Wdh.";
    return `
      <div class="${cls}">
        <button class="set-num" title="Antippen für Aufwärmsatz" onclick="toggleWarmup(${ei},${si})">${s.warmup ? "A" : workNo}</button>
        <input type="text" inputmode="decimal" autocomplete="off" placeholder="${hintW}"
          value="${s.weight === "" ? "" : String(s.weight).replace(".", ",")}"
          onchange="updateSet(${ei},${si},'weight',this.value)">
        <div class="set-x">×</div>
        <input type="text" inputmode="numeric" autocomplete="off" placeholder="${hintR}"
          value="${s.reps === "" || s.reps == null ? "" : s.reps}"
          onchange="updateSet(${ei},${si},'reps',this.value)">
        ${showRpe ? `<input class="set-rpe" type="text" inputmode="decimal" autocomplete="off" placeholder="RPE"
          value="${typeof s.rpe === "number" ? fmtNum(s.rpe) : ""}"
          onchange="updateSet(${ei},${si},'rpe',this.value)">` : ""}
        <button class="set-check" title="Satz erledigt" onclick="toggleDone(${ei},${si})">✓</button>
        <button class="set-del" onclick="deleteSet(${ei},${si})">✕</button>
      </div>`;
  }).join("");

  const labels = `<div class="set-labels">
      <span>Satz</span><span>Gewicht</span><span></span><span>Wdh.</span>
      ${showRpe ? "<span>RPE</span>" : ""}<span>✓</span><span></span>
    </div>`;

  const dayNoteHtml = entry.note
    ? `<div class="note note-day" onclick="editEntryNote(${ei})">✎<span>${escapeHtml(entry.note)}</span></div>`
    : `<button class="note note-day empty" onclick="editEntryNote(${ei})">✎<span>Notiz für heute</span></button>`;

  const photo = photoCache.get(entry.exerciseId);
  const photoHtml = photo
    ? `<img class="ex-thumb" src="${photo}" alt="" onclick="viewPhoto('${entry.exerciseId}')">`
    : `<button class="ex-photo-btn" title="Foto der Maschine hinzufügen" onclick="pickPhoto('${entry.exerciseId}')">📷</button>`;

  return `
    <div class="card exercise-card">
      <div class="exercise-title">
        <div class="ex-title-left" onclick="openExerciseSheet('${entry.exerciseId}')">
          ${photoHtml}
          <span>${escapeHtml(exName(entry.exerciseId))}</span>
        </div>
        <div class="ex-actions">
          <button class="icon-btn" title="Menü" onclick="openExerciseMenu(${ei})">⋯</button>
        </div>
      </div>
      <div class="target-line" onclick="openExerciseSheet('${entry.exerciseId}')">
        Ziel <b>${tgt.sets} × ${tgt.min}–${tgt.max}</b> Wdh.
        <span class="prog">${doneCount}/${tgt.sets} ✓</span>
      </div>
      ${noteHtml}
      ${lastHtml}
      ${recHtml}
      ${entry.sets.length ? `<div class="sets${showRpe ? " with-rpe" : ""}">${labels}${setsHtml}</div>` : ""}
      ${entry.sets.length ? `<div class="set-hint">Satznummer antippen = Aufwärmsatz · ✓ übernimmt den Vorschlag</div>` : ""}
      <button class="btn btn-ghost" style="width:auto;padding:8px 4px" onclick="addSet(${ei})">+ Satz hinzufügen</button>

function viewWorkout() {
  const w = state.active;

  // Aufeinanderfolgende Übungen mit gleicher Supersatz-Kennung zusammenfassen
  const groups = [];
  w.entries.forEach((entry, ei) => {
    const g = groups[groups.length - 1];
    if (entry.sgroup && g && g.sgroup === entry.sgroup) g.items.push({ entry, ei });
    else groups.push({ sgroup: entry.sgroup || null, items: [{ entry, ei }] });
  });
  const entriesHtml = groups.map(g => {
    const inner = g.items.map(it => exerciseCardHtml(it.entry, it.ei)).join("");
    return (g.sgroup && g.items.length > 1)
      ? `<div class="superset"><div class="superset-tag">⟡ Supersatz · ${g.items.length} Übungen ohne Pause</div>${inner}</div>`
      : inner;
  }).join("");

  return `
    <div class="workout-header">
      <div>
        <div class="sys-h">Quest aktiv</div>
        <h1 style="margin:0">Training läuft</h1>
      </div>
      <div class="timer" id="timer">0:00</div>
    </div>
    ${entriesHtml || `<div class="empty-state"><div class="big">💪</div>Füge deine erste Übung hinzu.</div>`}
    <button class="btn btn-secondary" style="margin-bottom:12px" onclick="openExercisePicker()">+ Übung hinzufügen</button>
    <button class="btn btn-primary" onclick="finishWorkout()">Training beenden ✓</button>
    ${w.entries.length ? `<button class="btn btn-ghost" onclick="saveAsTemplate()">Als Vorlage speichern</button>` : ""}
    <button class="btn btn-ghost" style="color:var(--red)" onclick="cancelWorkout()">Training verwerfen</button>
  `;
}

function startTimer() {
  const update = () => {
    const el = document.getElementById("timer");
    if (!el || !state.active) return;
    const s = Math.floor((Date.now() - state.active.start) / 1000);
    const m = Math.floor(s / 60);
    el.textContent = m >= 60
      ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`
      : `${m}:${String(s % 60).padStart(2, "0")}`;
  };
  update();
  timerInterval = setInterval(update, 1000);
}

// Vorschlagswerte für einen neuen Satz: erst der vorherige Satz dieses Trainings,
// sonst das letzte Training. Sie stehen nur als grauer Platzhalter im Feld –
// gespeichert wird erst, wenn getippt oder abgehakt wird.
function setHints(entry, index) {
  const prev = entry.sets.slice(0, index).filter(s => !s.warmup).pop();
  if (prev && prev.weight !== "" && prev.reps !== "") return { hintW: prev.weight, hintR: prev.reps };
  const last = lastPerformance(entry.exerciseId);
  if (last && last.sets.length) {
    const src = last.sets[Math.min(index, last.sets.length - 1)];
    return { hintW: src.weight, hintR: src.reps };
  }
  return {};
}

// Beim Hinzufügen einer Übung direkt die Ziel-Sätze als leere Zeilen anlegen
function fillTargetSets(entry) {
  const n = targetOf(entry.exerciseId).sets;
  while (entry.sets.length < n) {
    entry.sets.push(Object.assign({ weight: "", reps: "" }, setHints(entry, entry.sets.length)));
  }
}

function addSet(ei) {
  const entry = state.active.entries[ei];
  entry.sets.push(Object.assign({ weight: "", reps: "" }, setHints(entry, entry.sets.length)));
  save();
  render();
}

function updateSet(ei, si, field, value) {
  const s = state.active.entries[ei].sets[si];
  let num = parseFloat(String(value).replace(",", "."));
  if (field === "rpe") {
    s.rpe = isNaN(num) ? undefined : Math.min(10, Math.max(5, Math.round(num * 2) / 2));
    if (s.rpe === undefined) delete s.rpe;
  } else {
    if (!isNaN(num)) num = Math.abs(field === "reps" ? Math.round(num) : num);
    s[field] = isNaN(num) ? "" : num;
  }
  save();
}

function toggleWarmup(ei, si) {
  const s = state.active.entries[ei].sets[si];
  if (s.warmup) delete s.warmup; else s.warmup = true;
  save();
  render();
}

function toggleDone(ei, si) {
  const entry = state.active.entries[ei];
  const s = entry.sets[si];
  if (s.done) {
    delete s.done;
    save();
    render();
    return;
  }
  primeAudio();
  // Abhaken übernimmt den Vorschlag, wenn noch nichts eingetragen wurde
  if (s.weight === "" && typeof s.hintW === "number") s.weight = s.hintW;
  if (s.reps === "" && typeof s.hintR === "number") s.reps = s.hintR;
  if (s.weight === "" || s.reps === "" || !s.reps) {
    showAlert("Trag erst Gewicht und Wiederholungen ein – oder es gibt keinen Vorschlag zum Übernehmen.");
    return;
  }
  s.done = true;
  save();
  render();
  if (state.settings.autoRest && isLastOfSuperset(ei)) {
    const base = state.settings.restSeconds || 90;
    startRest(s.warmup ? Math.max(20, Math.round(base / 2 / 5) * 5) : base);
  }
}

function isLastOfSuperset(ei) {
  const e = state.active.entries[ei];
  if (!e.sgroup) return true;
  const next = state.active.entries[ei + 1];
  return !(next && next.sgroup === e.sgroup);
}

function deleteSet(ei, si) {
  state.active.entries[ei].sets.splice(si, 1);
  save();
  render();
}

async function removeExercise(ei) {
  const entry = state.active.entries[ei];
  const hasData = entry.sets.some(s => s.weight !== "" || s.reps !== "");
  if (hasData && !await showConfirm(`„${exName(entry.exerciseId)}" wirklich entfernen?`, "Entfernen", true)) return;
  state.active.entries.splice(ei, 1);
  save();
  render();
}

function moveExercise(ei, dir) {
  const list = state.active.entries;
  const to = ei + dir;
  if (to < 0 || to >= list.length) return;
  [list[ei], list[to]] = [list[to], list[ei]];
  save();
  render();
}

function linkSuperset(ei) {
  const list = state.active.entries;
  const a = list[ei], b = list[ei + 1];
  if (!b) return;
  const g = a.sgroup || b.sgroup || uid();
  a.sgroup = g; b.sgroup = g;
  save();
  render();
}

function unlinkSuperset(ei) {
  const g = state.active.entries[ei].sgroup;
  if (!g) return;
  state.active.entries.forEach(e => { if (e.sgroup === g) delete e.sgroup; });
  save();
  render();
}

/* ============ Pausentimer ============ */
let restEnd = 0, restTotal = 0, restInterval = null, audioCtx = null;

function primeAudio() {
  // iOS erlaubt Töne nur nach einer Nutzer-Aktion – deshalb hier vorbereiten
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}

function beep() {
  try {
    primeAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [[880, 0], [1180, 0.18]].forEach(([freq, off]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.3, t + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.16);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + off); o.stop(t + off + 0.2);
    });
  } catch (e) { /* ohne Ton läuft der Timer trotzdem */ }
}

function startRest(seconds) {
  restTotal = seconds;
  restEnd = Date.now() + seconds * 1000;
  const bar = document.getElementById("rest-bar");
  if (bar) bar.hidden = false;
  if (restInterval) clearInterval(restInterval);
  restInterval = setInterval(tickRest, 200);
  tickRest();
}

function tickRest() {
  const left = Math.max(0, restEnd - Date.now());
  const s = Math.ceil(left / 1000);
  const timeEl = document.getElementById("rest-time");
  const fillEl = document.getElementById("rest-fill");
  if (timeEl) timeEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  if (fillEl) fillEl.style.width = (restTotal ? (left / (restTotal * 1000)) * 100 : 0) + "%";
  if (left <= 0) {
    stopRest();
    if (state.settings.vibrate && navigator.vibrate) navigator.vibrate([130, 90, 130]);
    if (state.settings.sound) beep();
  }
}

function adjustRest(delta) {
  if (!restInterval) return;
  restEnd = Math.max(Date.now(), restEnd + delta * 1000);
  restTotal = Math.max(10, restTotal + delta);
  tickRest();
}

function stopRest() {
  if (restInterval) { clearInterval(restInterval); restInterval = null; }
  const bar = document.getElementById("rest-bar");
  if (bar) bar.hidden = true;
}

async function finishWorkout() {
  const w = state.active;
  // Leere Sätze und Übungen ohne Sätze aussortieren
  const entries = w.entries
    .map(e => ({
      ...e,
      sets: e.sets
        .filter(s => s.weight !== "" && s.reps !== "" && s.reps > 0)
        // Vorschlagswerte und Häkchen sind nur währenddessen relevant
        .map(({ hintW, hintR, done, ...rest }) => rest)
    }))
    .filter(e => workSets(e.sets).length > 0);
  if (!entries.length) {
    showAlert("Trage erst mindestens einen Satz mit Gewicht und Wiederholungen ein.");
    return;
  }
  if (!await showConfirm("Training beenden und speichern?", "Beenden")) return;
  const saved = { id: uid(), start: w.start, end: Date.now(), type: "strength", entries };
  if (w.templateId) saved.templateId = w.templateId;
  state.workouts.push(saved);
  state.active = null;
  stopRest();
  save();
  currentTab = "history";
  expandedWorkout = saved.id;
  render();
  celebrate(saved);
}

function celebrate(w) {
  const sets = w.entries.reduce((n, e) => n + workSets(e.sets).length, 0);
  const volume = Math.round(w.entries.reduce((v, e) => v + setVolume(e.sets), 0));
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop dialog-backdrop";
  backdrop.innerHTML = `<div class="dialog">
    <div class="sys-badge">⟦ System ⟧</div>
    <div class="celebrate-emoji">🏆</div>
    <h2 style="text-align:center;font-size:13px;margin-bottom:10px">Quest abgeschlossen</h2>
    <p style="margin-bottom:14px">Stark! Das hast du heute geleistet:</p>
    <div class="stats-grid">
      <div class="stat"><div class="stat-val">${fmtDuration(w.end - w.start)}</div><div class="stat-label">Dauer</div></div>
      <div class="stat"><div class="stat-val">${w.entries.length}</div><div class="stat-label">Übungen</div></div>
      <div class="stat"><div class="stat-val">${sets}</div><div class="stat-label">Sätze</div></div>
      <div class="stat"><div class="stat-val">${volume.toLocaleString("de-DE")} kg</div><div class="stat-label">Gesamt bewegt</div></div>
    </div>
    <button class="btn btn-primary">Weiter</button>
  </div>`;
  backdrop.addEventListener("click", e => {
    if (e.target === backdrop || e.target.closest(".btn")) backdrop.remove();
  });
  document.body.appendChild(backdrop);
}

async function cancelWorkout() {
  if (!await showConfirm("Training wirklich verwerfen? Alle Eingaben gehen verloren.", "Verwerfen", true)) return;
  state.active = null;
  stopRest();
  save();
  render();
}

/* ============ Blätter von unten (Menüs & Formulare) ============ */
function openSheet(title, innerHtml) {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `<div class="modal">
    <h2>${escapeHtml(title)}</h2>
    <div class="sheet-scroll">${innerHtml}</div>
  </div>`;
  backdrop.addEventListener("click", e => { if (e.target === backdrop) backdrop.remove(); });
  document.body.appendChild(backdrop);
  return backdrop;
}

function openExerciseMenu(ei) {
  const list = state.active.entries;
  const entry = list[ei];
  const next = list[ei + 1];
  const items = [
    { icon: "📊", label: "Details & Ziele", act: "details" },
    { icon: "✏️", label: "Umbenennen", act: "rename" },
    { icon: "📌", label: "Notiz zur Übung", act: "note" },
    { icon: "🔁", label: "Übung tauschen", act: "swap" }
  ];
  if (ei > 0) items.push({ icon: "⬆️", label: "Nach oben schieben", act: "up" });
  if (ei < list.length - 1) items.push({ icon: "⬇️", label: "Nach unten schieben", act: "down" });
  if (next && !(entry.sgroup && next.sgroup === entry.sgroup)) {
    items.push({ icon: "⟡", label: `Supersatz mit „${exName(next.exerciseId)}"`, act: "link" });
  }
  if (entry.sgroup) items.push({ icon: "🔓", label: "Supersatz auflösen", act: "unlink" });
  items.push({ icon: "✕", label: "Aus Training entfernen", act: "remove", cls: "danger" });

  const sheet = openSheet(exName(entry.exerciseId), items.map(i =>
    `<button class="sheet-btn ${i.cls || ""}" data-act="${i.act}">
       <span class="sb-icon">${i.icon}</span>${escapeHtml(i.label)}
     </button>`).join(""));

  sheet.addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    sheet.remove();
    const act = btn.dataset.act;
    if (act === "details") openExerciseSheet(entry.exerciseId);
    else if (act === "rename") renameExercise(entry.exerciseId);
    else if (act === "note") editExerciseNote(entry.exerciseId);
    else if (act === "swap") openExercisePicker(ei);
    else if (act === "up") moveExercise(ei, -1);
    else if (act === "down") moveExercise(ei, 1);
    else if (act === "link") linkSuperset(ei);
    else if (act === "unlink") unlinkSuperset(ei);
    else if (act === "remove") removeExercise(ei);
  });
}

const MUSCLES = ["Brust", "Rücken", "Schultern", "Bizeps", "Trizeps", "Beine", "Waden", "Bauch", "Ganzkörper"];

// Alle Sätze einer Übung über alle Trainings – Grundlage für die Bestwerte
function exerciseStats(id) {
  const rows = [];
  state.workouts.forEach(w => {
    const entry = w.entries.find(e => e.exerciseId === id);
    if (!entry) return;
    const sets = workSets(entry.sets);
    if (!sets.length) return;
    const best = sets.reduce((m, s) => s.weight > m.weight ? s : m, sets[0]);
    const bestE = sets.reduce((m, s) => epley(s.weight, s.reps) > epley(m.weight, m.reps) ? s : m, sets[0]);
    rows.push({ date: w.start, sets, best, volume: setVolume(sets), oneRm: epley(bestE.weight, bestE.reps) });
  });
  rows.sort((a, b) => b.date - a.date);
  return {
    rows,
    trainings: rows.length,
    maxWeight: rows.length ? Math.max(...rows.map(r => r.best.weight)) : 0,
    maxVolume: rows.length ? Math.max(...rows.map(r => r.volume)) : 0,
    maxOneRm: rows.length ? Math.max(...rows.map(r => r.oneRm)) : 0
  };
}

/* ============ Übungs-Auswahl (Modal) ============ */
async function deleteExerciseFlow(id) {
  const ex = exercise(id);
  if (!ex) return;
  const used = state.workouts.some(w => w.entries.some(en => en.exerciseId === id));
  const msg = used
    ? `„${ex.name}" aus der Auswahl entfernen? Deine gespeicherten Trainings mit dieser Übung bleiben im Verlauf erhalten.`
    : `„${ex.name}" wirklich löschen?`;
  if (!await showConfirm(msg, "Entfernen", true)) return;
  if (used) {
    // Übung nur ausblenden, damit alte Trainings ihren Namen behalten
    ex.archived = true;
  } else {
    state.exercises = state.exercises.filter(x => x.id !== id);
    photoCache.delete(id);
    idbDeletePhoto(id);
  }
  save();
}

// Wiederverwendbare Übungsauswahl. Liefert die gewählte Übungs-ID
// oder null, wenn abgebrochen wurde. Neue Übungen entstehen direkt beim Tippen.
function chooseExercise(opts = {}) {
  const title = opts.title || "Übung hinzufügen";
  const exclude = opts.exclude || new Set();
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <h2>${escapeHtml(title)}</h2>
        <input type="text" id="ex-search" placeholder="Name der Übung eingeben …" autocomplete="off">
        <div class="exercise-list" id="ex-list"></div>
      </div>`;
    let settled = false;
    const done = v => { if (settled) return; settled = true; backdrop.remove(); resolve(v); };
    backdrop.addEventListener("click", e => { if (e.target === backdrop) done(null); });
    document.body.appendChild(backdrop);

    const search = backdrop.querySelector("#ex-search");
    const list = backdrop.querySelector("#ex-list");

    const renderList = () => {
      const q = search.value.trim().toLowerCase();
      const matches = state.exercises
        .filter(e => !e.archived && !exclude.has(e.id) && e.name.toLowerCase().includes(q))
        .sort((a, b) => a.name.localeCompare(b.name, "de"));
      let html = matches.map(e => {
        const last = lastPerformance(e.id);
        const photo = photoCache.get(e.id);
        return `<div class="exercise-option" data-id="${e.id}">
          ${photo ? `<img class="opt-thumb" src="${photo}" alt="">` : ""}
          <span>${escapeHtml(e.name)}
            ${last ? `<span class="opt-last">Letztes Mal: ${setsSummary(last.sets)}</span>` : ""}
            ${e.note ? `<span class="opt-note">📌 ${escapeHtml(e.note)}</span>` : ""}
          </span>
          <button class="opt-edit" data-rename="${e.id}" title="Umbenennen">✏️</button>
          <button class="opt-del" data-del="${e.id}" title="Übung löschen">✕</button>
        </div>`;
      }).join("");
      if (q && !state.exercises.some(e => !e.archived && e.name.toLowerCase() === q)) {
        html = `<button class="exercise-option create-new" data-create="1">+ „${escapeHtml(search.value.trim())}" neu erstellen</button>` + html;
      }
      list.innerHTML = html || `<div class="empty-state">Tippe oben den Namen ein,<br>um deine erste Übung anzulegen —<br>z. B. „Brustpresse 1".</div>`;
    };

    list.addEventListener("click", async e => {
      const ren = e.target.closest("[data-rename]");
      if (ren) { await renameExercise(ren.dataset.rename); renderList(); return; }
      const del = e.target.closest("[data-del]");
      if (del) { await deleteExerciseFlow(del.dataset.del); renderList(); return; }
      const btn = e.target.closest(".exercise-option");
      if (!btn) return;
      if (btn.dataset.create) {
        const id = uid();
        state.exercises.push({ id, name: search.value.trim() });
        save();
        done(id);
      } else {
        done(btn.dataset.id);
      }
    });

    search.addEventListener("input", renderList);
    renderList();
    search.focus();
  });
}

// swapIndex gesetzt → die Übung an dieser Stelle wird ersetzt, die Sätze bleiben stehen
async function openExercisePicker(swapIndex = null) {
  const swapping = swapIndex !== null;
  const exclude = new Set(state.active.entries.map(e => e.exerciseId));
  if (swapping) exclude.delete(state.active.entries[swapIndex].exerciseId);
  const id = await chooseExercise({ title: swapping ? "Übung tauschen" : "Übung hinzufügen", exclude });
  if (!id) return;
  if (swapping) {
    // Sätze und Notiz bleiben stehen, nur die Übung dahinter wechselt
    state.active.entries[swapIndex].exerciseId = id;
  } else {
    const entry = { exerciseId: id, sets: [] };
    state.active.entries.push(entry);
    fillTargetSets(entry);
  }
  save();
  render();
}

/* ============ Ansicht: Verlauf ============ */
let calMonth = null;   // { y, m } – null heißt: aktueller Monat

function shiftMonth(delta) {
  const base = calMonth || { y: new Date().getFullYear(), m: new Date().getMonth() };
  const d = new Date(base.y, base.m + delta, 1);
  calMonth = { y: d.getFullYear(), m: d.getMonth() };
  render();
}

function calendarHtml() {
  const now = new Date();
  const { y, m } = calMonth || { y: now.getFullYear(), m: now.getMonth() };
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const lead = isoDay(first) - 1;
  const todayK = dayKey(now);

  // Trainings des Monats nach Tag bündeln
  const byDay = {};
  state.workouts.forEach(w => {
    const d = new Date(w.start);
    if (d.getFullYear() === y && d.getMonth() === m) (byDay[d.getDate()] = byDay[d.getDate()] || []).push(w);
  });

  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<div class="cal-day"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const list = byDay[day] || [];
    const k = dayKey(new Date(y, m, day));
    const dots = list.slice(0, 3).map(w => {
      const t = w.templateId ? template(w.templateId) : null;
      return `<span class="cal-dot" style="background:${t ? tplColor(t) : "var(--accent)"}"></span>`;
    }).join("");
    cells += `<button class="cal-day ${list.length ? "has" : ""} ${k === todayK ? "today" : ""} ${list.length && expandedWorkout === list[0].id ? "sel" : ""}"
      ${list.length ? `onclick="toggleWorkout('${list[0].id}')"` : ""}>
      <span>${day}</span><span class="cal-dots">${dots}</span>
    </button>`;
  }

  const monat = first.toLocaleDateString("de-DE", { month: "long", year: "numeric" });
  return `
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" onclick="shiftMonth(-1)">‹</button>
        <div class="cal-title">${monat}</div>
        <button class="cal-nav" onclick="shiftMonth(1)">›</button>
      </div>
      <div class="cal-grid">
        ${WD_SHORT.map(w => `<div class="cal-wd">${w}</div>`).join("")}
        ${cells}
      </div>
    </div>`;
}

function viewHistory() {
  const sorted = [...state.workouts].sort((a, b) => b.start - a.start);
  if (!sorted.length) {
    return `<div class="sys-h">Archiv</div><h1>Verlauf</h1><p class="subtitle">Deine abgeschlossenen Trainings</p>
      <div class="empty-state"><div class="big">📅</div>Noch keine Trainings gespeichert.</div>`;
  }
  const items = sorted.map(w => {
    const expanded = expandedWorkout === w.id;
    const details = expanded ? `
      <div class="history-details">
        ${w.entries.map(e => `
          <div class="history-ex">
            <div class="history-ex-name">${escapeHtml(exName(e.exerciseId))}</div>
            <div class="history-ex-sets">${setsSummary(e.sets, true)}</div>
            ${e.note ? `<div class="history-ex-note">✎ ${escapeHtml(e.note)}</div>` : ""}
          </div>`).join("")}
        <button class="del-workout" onclick="event.stopPropagation();deleteWorkout('${w.id}')">Training löschen</button>
      </div>` : "";
    const tpl = w.templateId ? template(w.templateId) : null;
    return `
      <div class="card history-item" onclick="toggleWorkout('${w.id}')">
        <div class="history-date">${tpl ? `<span style="color:${tplColor(tpl)}">●</span> ` : ""}${fmtDate(w.start)}${tpl ? ` · ${escapeHtml(tpl.name)}` : ""}</div>
        <div class="history-meta">${fmtCount(w.entries.length, "Übung", "Übungen")} · ${fmtCount(w.entries.reduce((n, e) => n + workSets(e.sets).length, 0), "Satz", "Sätze")} · ${fmtDuration(w.end - w.start)}</div>
        ${details}
      </div>`;
  }).join("");
  return `<div class="sys-h">Archiv アーカイブ</div><h1>Verlauf</h1>
    <p class="subtitle">${sorted.length} Training${sorted.length === 1 ? "" : "s"} gespeichert</p>
    ${calendarHtml()}${items}`;
}

function toggleWorkout(id) {
  expandedWorkout = expandedWorkout === id ? null : id;
  render();
}

async function deleteWorkout(id) {
  if (!await showConfirm("Dieses Training endgültig löschen?", "Löschen", true)) return;
  state.workouts = state.workouts.filter(w => w.id !== id);
  save();
  render();
}

/* ============ Ansicht: Fortschritt ============ */
function viewProgress() {
  // Nur Übungen anzeigen, die schon in Trainings vorkommen
  const usedIds = new Set();
  state.workouts.forEach(w => w.entries.forEach(e => usedIds.add(e.exerciseId)));
  const used = state.exercises
    .filter(e => usedIds.has(e.id))
    .sort((a, b) => a.name.localeCompare(b.name, "de"));

  if (!used.length) {
    return `<div class="sys-h">Analyse</div><h1>Fortschritt</h1><p class="subtitle">Deine Entwicklung pro Übung</p>
      <div class="empty-state"><div class="big">📈</div>Sobald du Trainings abgeschlossen hast,<br>siehst du hier deine Steigerung.</div>`;
  }
  if (!progressExercise || !usedIds.has(progressExercise)) progressExercise = used[0].id;

  const options = used.map(e =>
    `<option value="${e.id}" ${e.id === progressExercise ? "selected" : ""}>${escapeHtml(e.name)}</option>`).join("");

  // Verlauf dieser Übung: pro Training der beste Satz (höchstes Gewicht)
  const history = [...state.workouts]
    .sort((a, b) => a.start - b.start)
    .map(w => {
      const entry = w.entries.find(e => e.exerciseId === progressExercise);
      if (!entry) return null;
      const sets = workSets(entry.sets);
      if (!sets.length) return null;
      const best = sets.reduce((m, s) => s.weight > m.weight ? s : m, sets[0]);
      return { date: w.start, best, volume: setVolume(sets), sets };
    })
    .filter(Boolean);

  if (!history.length) {
    return `<div class="sys-h">Analyse</div><h1>Fortschritt</h1>
      <select onchange="progressExercise=this.value;render()">${options}</select>
      <div class="empty-state">Für diese Übung sind nur Aufwärmsätze gespeichert.</div>`;
  }

  const maxWeight = Math.max(...history.map(h => h.best.weight));
  const stats = exerciseStats(progressExercise);

  const rows = [...history].reverse().map(h => `
    <div class="progress-row">
      <span class="p-date">${fmtDateShort(h.date)}</span>
      <span>${setsSummary([h.best])}${h.best.weight === maxWeight ? ' <span class="best-badge">★ Bestwert</span>' : ""}</span>
    </div>`).join("");

  const photo = photoCache.get(progressExercise);
  const note = exNote(progressExercise);
  const infoHtml = (photo || note) ? `
    <div class="card" style="padding:12px 14px">
      <div style="display:flex;align-items:center;gap:12px">
        ${photo ? `<img class="ex-thumb" src="${photo}" alt="" onclick="viewPhoto('${progressExercise}')">` : ""}
        <span style="color:var(--muted);font-size:13.5px">${photo ? "Foto der Maschine – zum Vergrößern antippen" : escapeHtml(exName(progressExercise))}</span>
      </div>
      ${note ? `<div class="note note-ex" onclick="editExerciseNote('${progressExercise}')">📌<span>${escapeHtml(note)}</span></div>` : ""}
    </div>` : "";

  return `
    <div class="sys-h">Analyse</div>
    <h1>Fortschritt</h1>
    <p class="subtitle">Bester Satz pro Training</p>
    <select onchange="progressExercise=this.value;render()">${options}</select>
    ${infoHtml}
    <div class="kv-grid">
      <div class="kv"><div class="kv-val">${fmtWeight(stats.maxWeight)}</div><div class="kv-lbl">Bestes Gewicht</div></div>
      <div class="kv"><div class="kv-val">${fmtWeight(Math.round(stats.maxOneRm * 2) / 2)}</div><div class="kv-lbl">Geschätztes 1RM</div></div>
    </div>
    <button class="btn btn-ghost" style="margin-bottom:8px" onclick="openExerciseSheet('${progressExercise}')">Details &amp; Ziele öffnen</button>
    ${history.length >= 2 ? `<div class="card chart-wrap">${chartSvg(history)}</div>` : ""}
    <div class="card">${rows}</div>
  `;
}

function chartSvg(history) {
  const W = 320, H = 140, pad = { l: 34, r: 12, t: 12, b: 24 };
  const weights = history.map(h => h.best.weight);
  let min = Math.min(...weights), max = Math.max(...weights);
  if (min === max) { min -= 5; max += 5; }
  const range = max - min;
  min -= range * 0.1; max += range * 0.1;

  const x = i => pad.l + (i / (history.length - 1)) * (W - pad.l - pad.r);
  const y = v => H - pad.b - ((v - min) / (max - min)) * (H - pad.t - pad.b);

  const points = history.map((h, i) => `${x(i).toFixed(1)},${y(h.best.weight).toFixed(1)}`).join(" ");
  const baseY = (H - pad.b).toFixed(1);
  const area = `${x(0).toFixed(1)},${baseY} ${points} ${x(history.length - 1).toFixed(1)},${baseY}`;
  const dots = history.map((h, i) => {
    const isLast = i === history.length - 1;
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(h.best.weight).toFixed(1)}" r="${isLast ? 5 : 3.5}"
      fill="var(--accent)" ${isLast ? 'stroke="#fff" stroke-width="1.5"' : ""}/>`;
  }).join("");

  const yTicks = [min + (max - min) * 0.1, (min + max) / 2, max - (max - min) * 0.1].map(v => {
    const val = Math.round(v);
    return `<text x="${pad.l - 6}" y="${(y(val) + 4).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">${val}</text>
      <line x1="${pad.l}" y1="${y(val).toFixed(1)}" x2="${W - pad.r}" y2="${y(val).toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>`;
  }).join("");

  const first = fmtDateShort(history[0].date);
  const last = fmtDateShort(history[history.length - 1].date);

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8b5cff"/><stop offset="1" stop-color="#4fd8ff"/>
      </linearGradient>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(79,216,255,0.30)"/><stop offset="1" stop-color="rgba(79,216,255,0)"/>
      </linearGradient>
    </defs>
    ${yTicks}
    <polygon points="${area}" fill="url(#areaGrad)"/>
    <polyline points="${points}" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${pad.l}" y="${H - 6}" fill="var(--muted)" font-size="10">${first}</text>
    <text x="${W - pad.r}" y="${H - 6}" fill="var(--muted)" font-size="10" text-anchor="end">${last}</text>
  </svg>`;
}

/* ============ Start ============ */
document.getElementById("photo-input").addEventListener("change", e => {
  const file = e.target.files[0];
  e.target.value = "";
  handlePhotoFile(file);
});

document.getElementById("import-input").addEventListener("change", e => {
  const file = e.target.files[0];
  e.target.value = "";
  handleImportFile(file);
});

render(true);
loadPhotos();
</script>
