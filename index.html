<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#04070f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Gym Tracker</title>
<style>
  :root {
    --bg: #04070f;
    --card: #0a1220;
    --card2: #101b2d;
    --border: rgba(94, 200, 255, 0.22);
    --border-strong: rgba(94, 200, 255, 0.45);
    --text: #e9f4ff;
    --muted: #8298b3;
    --accent: #4fd8ff;
    --accent2: #8b5cff;
    --gold: #ffcc55;
    --red: #ff5a6e;
    --radius: 6px;
    --grad: linear-gradient(120deg, #4fd8ff 0%, #7b6cff 100%);
    --glow: rgba(79, 216, 255, 0.32);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { background: var(--bg); }
  body {
    background:
      radial-gradient(1000px 620px at 82% -12%, rgba(79, 216, 255, 0.11), transparent 62%),
      radial-gradient(820px 620px at -12% 18%, rgba(139, 92, 255, 0.11), transparent 62%),
      linear-gradient(rgba(94, 200, 255, 0.032) 1px, transparent 1px) 0 0 / 100% 40px,
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    overscroll-behavior: none;
    overflow-x: hidden;
  }
  /* feine Scanlines – gibt dem Ganzen den Systemfenster-Look */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 300;
    background: repeating-linear-gradient(180deg, rgba(180, 230, 255, 0.025) 0 1px, transparent 1px 3px);
  }

  /* ---------- Animationen ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes slideUp {
    from { transform: translateY(48px); opacity: 0.4; }
    to   { transform: none; opacity: 1; }
  }
  @keyframes sysPop {
    0%   { transform: scale(0.9); opacity: 0; filter: brightness(2.2); }
    55%  { transform: scale(1.015); opacity: 1; filter: brightness(1.25); }
    100% { transform: scale(1); opacity: 1; filter: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes bounceIn {
    0%   { transform: scale(0) rotate(-20deg); }
    60%  { transform: scale(1.18) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes sweep {
    from { transform: translateY(-100%); opacity: 0.7; }
    to   { transform: translateY(400%); opacity: 0; }
  }
  main.anim > * { animation: rise 0.4s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
  main.anim > *:nth-child(2) { animation-delay: 0.04s; }
  main.anim > *:nth-child(3) { animation-delay: 0.08s; }
  main.anim > *:nth-child(4) { animation-delay: 0.12s; }
  main.anim > *:nth-child(5) { animation-delay: 0.16s; }
  main.anim > *:nth-child(n+6) { animation-delay: 0.2s; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    body::after { display: none; }
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    padding: 16px 16px calc(84px + env(safe-area-inset-bottom));
    padding-top: calc(16px + env(safe-area-inset-top));
  }

  /* ---------- Überschriften im System-Stil ---------- */
  h1 {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .sys-h {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
  }
  .sys-h::before {
    content: "";
    width: 14px; height: 1px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .head-block { position: relative; }
  .deco-kana {
    position: absolute;
    top: -4px; right: 0;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    opacity: 0.28;
    font-family: var(--mono);
    pointer-events: none;
  }

  /* ---------- Tab-Bar ---------- */
  nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    background: linear-gradient(180deg, rgba(10, 18, 32, 0.96), rgba(4, 7, 15, 0.98));
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 50;
  }
  nav button {
    position: relative;
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 11px 0 9px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: inherit;
  }
  nav button .icon { font-size: 21px; line-height: 1; transition: transform 0.2s cubic-bezier(0.3, 1.4, 0.4, 1); }
  nav button.active { color: var(--accent); }
  nav button.active .icon { transform: translateY(-2px) scale(1.12); }
  nav button.active::before {
    content: "";
    position: absolute;
    top: -1px; left: 24%; right: 24%;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }

  /* ---------- Karten = Statusfenster ---------- */
  .card {
    position: relative;
    background:
      linear-gradient(90deg, transparent, rgba(79, 216, 255, 0.5) 25%, rgba(139, 92, 255, 0.5) 75%, transparent) top left / 100% 1px no-repeat,
      linear-gradient(180deg, rgba(79, 216, 255, 0.055), transparent 45%),
      var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 9px; height: 9px;
    border: 1.5px solid var(--accent);
    opacity: 0.65;
    pointer-events: none;
  }
  .card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  /* ---------- Buttons ---------- */
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 0.06em;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .btn:active { transform: scale(0.965); filter: brightness(1.15); }
  .btn-primary {
    background: var(--grad);
    color: #03121c;
    font-weight: 800;
    text-transform: uppercase;
    box-shadow: 0 8px 26px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .btn-secondary {
    background: linear-gradient(180deg, rgba(79, 216, 255, 0.09), rgba(79, 216, 255, 0.02));
    color: var(--text);
    border: 1px solid var(--border-strong);
    text-transform: uppercase;
    font-size: 15px;
  }
  .btn-danger {
    background: linear-gradient(135deg, #ff7a86, #d92b40);
    color: #fff;
    text-transform: uppercase;
    box-shadow: 0 6px 18px rgba(255, 90, 110, 0.28);
  }
  .btn-ghost {
    background: none;
    color: var(--accent);
    font-size: 14px;
    letter-spacing: 0.08em;
    padding: 12px;
  }

  /* ---------- Aktives Training ---------- */
  .workout-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .timer {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: var(--accent);
    font-weight: 700;
    background: rgba(79, 216, 255, 0.1);
    border: 1px solid var(--border-strong);
    padding: 6px 13px;
    border-radius: 4px;
  }
  .timer::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .exercise-card { padding: 14px 14px 10px; }
  .exercise-title {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .ex-title-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .ex-title-left > span { min-width: 0; overflow-wrap: anywhere; }
  .ex-actions { display: flex; flex-shrink: 0; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 6px 7px;
    font-family: inherit;
  }
  .icon-btn:active { color: var(--accent); }
  .ex-thumb {
    width: 44px; height: 44px;
    border-radius: 4px;
    object-fit: cover;
    border: 1px solid var(--border-strong);
    cursor: pointer;
    flex-shrink: 0;
    display: block;
  }
  .ex-photo-btn {
    width: 44px; height: 44px;
    border-radius: 4px;
    background: var(--card2);
    border: 1px dashed var(--border-strong);
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .photo-viewer {
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 14px;
    width: 100%;
    max-width: 340px;
    animation: sysPop 0.3s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  .photo-viewer img { width: 100%; border-radius: 4px; display: block; }

  /* ---------- Notizen ---------- */
  .note {
    display: flex;
    gap: 7px;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.45;
    border-radius: 4px;
    padding: 8px 10px;
    margin: 8px 0 4px;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  .note-ex {
    color: var(--gold);
    background: rgba(255, 204, 85, 0.07);
    border: 1px solid rgba(255, 204, 85, 0.28);
    border-left: 3px solid var(--gold);
  }
  .note-day {
    color: var(--accent);
    background: rgba(79, 216, 255, 0.06);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }
  .note.empty {
    color: var(--muted);
    background: none;
    border: 1px dashed var(--border);
    border-left: 1px dashed var(--border);
    font-size: 13px;
  }
  .note-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.4; }

  .last-time { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .last-time strong { color: var(--text); font-weight: 600; }
  .recommend {
    font-size: 13.5px;
    color: var(--text);
    background: linear-gradient(90deg, rgba(79, 216, 255, 0.13), rgba(79, 216, 255, 0.03));
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 9px 11px;
    margin-bottom: 10px;
    line-height: 1.45;
  }
  .rec-head {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 3px;
  }
  .recommend strong { color: var(--accent); }
  .rec-why { color: var(--muted); font-size: 12.5px; }

  .template-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 10px 12px 16px;
    cursor: pointer;
  }
  .tpl-info { min-width: 0; }
  .tpl-names { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .backup-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
  }
  .btn-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
    padding: 6px;
  }

  .set-row {
    display: grid;
    grid-template-columns: 40px 1fr 22px 1fr 34px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .set-num {
    color: var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    text-align: center;
  }
  .set-row input {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 10px 4px;
    font-family: inherit;
  }
  .set-row input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(79, 216, 255, 0.25), 0 0 14px rgba(79, 216, 255, 0.2);
  }
  .set-x { color: var(--muted); text-align: center; font-size: 14px; }
  .set-del {
    background: none; border: none;
    color: var(--muted);
    font-size: 17px;
    cursor: pointer;
    text-align: center;
    padding: 6px 0;
  }
  .set-labels {
    display: grid;
    grid-template-columns: 40px 1fr 22px 1fr 34px;
    gap: 8px;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin-bottom: 6px;
  }
  .set-labels span { text-align: center; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 5, 11, 0.8);
    backdrop-filter: blur(3px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fade 0.2s ease both;
  }
  .modal {
    position: relative;
    background: linear-gradient(180deg, rgba(79, 216, 255, 0.07), transparent 30%), var(--card);
    border: 1px solid var(--border-strong);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    max-height: 82dvh;
    display: flex;
    flex-direction: column;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    animation: slideUp 0.32s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    overflow: hidden;
  }
  .modal::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--grad);
    box-shadow: 0 0 14px var(--glow);
  }
  .modal h2, .dialog h2 {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .modal input[type="text"], .modal textarea, .dialog input[type="text"], .dialog textarea {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 16px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-family: inherit;
    resize: none;
  }
  .modal input:focus, .modal textarea:focus, .dialog input:focus, .dialog textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(79, 216, 255, 0.22);
  }
  .exercise-list { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .exercise-option {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    padding: 10px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .exercise-option .opt-thumb {
    width: 40px; height: 40px;
    border-radius: 4px;
    object-fit: cover;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .exercise-option .opt-last { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .exercise-option .opt-note { display: block; font-size: 12px; color: var(--gold); margin-top: 2px; opacity: 0.85; }
  .exercise-option > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .opt-del, .opt-edit {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    padding: 10px 7px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .create-new { color: var(--accent); font-weight: 700; }

  /* ---------- Dialog (Systemfenster) ---------- */
  .dialog-backdrop { align-items: center; padding: 24px; }
  .dialog {
    position: relative;
    background: linear-gradient(180deg, rgba(79, 216, 255, 0.08), transparent 40%), var(--card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 18px 16px 16px;
    width: 100%;
    max-width: 330px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(79, 216, 255, 0.12);
    animation: sysPop 0.3s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    overflow: hidden;
  }
  .dialog::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--grad);
    box-shadow: 0 0 14px var(--glow);
  }
  .dialog p { font-size: 15.5px; line-height: 1.5; margin-bottom: 18px; text-align: center; }
  .dialog-buttons { display: flex; gap: 10px; }
  .dialog-buttons .btn { padding: 12px; font-size: 14px; }
  .sys-badge {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 10px;
    opacity: 0.75;
  }

  /* ---------- Trainings-Abschluss ---------- */
  .celebrate-emoji {
    font-size: 54px;
    text-align: center;
    animation: bounceIn 0.65s cubic-bezier(0.3, 1.4, 0.4, 1) both;
    margin-bottom: 4px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 8px;
    text-align: center;
  }
  .stat-val {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 14px var(--glow);
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin-top: 4px;
  }

  /* ---------- Verlauf ---------- */
  .history-item { cursor: pointer; }
  .history-date { font-weight: 700; font-size: 16px; }
  .history-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .history-details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .history-ex { margin-bottom: 10px; }
  .history-ex-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .history-ex-sets { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .history-ex-note { color: var(--accent); font-size: 12.5px; margin-top: 3px; opacity: 0.9; }
  .del-workout {
    margin-top: 10px;
    background: none;
    border: none;
    color: var(--red);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 0;
    font-family: inherit;
  }

  /* ---------- Fortschritt ---------- */
  select {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    color: var(--text);
    font-size: 16px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .progress-row:last-child { border-bottom: none; }
  .progress-row .p-date { color: var(--muted); font-size: 14px; font-family: var(--mono); }
  .best-badge { color: var(--gold); font-weight: 700; text-shadow: 0 0 12px rgba(255, 204, 85, 0.4); }
  .chart-wrap { margin-bottom: 8px; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 15px;
    line-height: 1.55;
  }
  .empty-state .big { font-size: 42px; margin-bottom: 12px; animation: floaty 3s ease-in-out infinite; }
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav id="nav">
    <button data-tab="home"><span class="icon">🏋️</span>Training</button>
    <button data-tab="history"><span class="icon">📅</span>Verlauf</button>
    <button data-tab="progress"><span class="icon">📈</span>Fortschritt</button>
  </nav>
</div>
<input type="file" id="photo-input" accept="image/*" hidden>
<input type="file" id="import-input" accept=".json,application/json" hidden>

<script>
"use strict";

/* ============ Daten ============ */
const STORAGE_KEY = "gymtracker-v1";
const SAFETY_KEY = "gymtracker-v1-pre-v2";   // unangetastete Kopie vor der ersten Migration
const DATA_VERSION = 2;

let state = load();

// Migration: ausschließlich additiv. Es wird nie ein Feld gelöscht oder überschrieben,
// nur fehlende Felder werden ergänzt. Alte Backups bleiben dadurch importierbar.
function migrate(data) {
  if (!data || typeof data !== "object") return data;
  data.exercises = data.exercises || [];
  data.workouts = data.workouts || [];
  data.templates = data.templates || [];
  data.settings = Object.assign({ restSeconds: 90, sound: true, vibrate: true }, data.settings || {});
  data.plan = data.plan || { days: {} };
  data.workouts.forEach(w => {
    if (!w.type) w.type = "strength";
    (w.entries || []).forEach(e => { e.sets = e.sets || []; });
  });
  if (data.active) {
    if (!data.active.type) data.active.type = "strength";
    (data.active.entries || []).forEach(e => { e.sets = e.sets || []; });
  }
  data.version = DATA_VERSION;
  return data;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      // Sicherheitsnetz: einmalig den Stand vor der Migration wegsichern
      if (!data.version && !localStorage.getItem(SAFETY_KEY)) {
        try { localStorage.setItem(SAFETY_KEY, raw); } catch (e) { /* Speicher voll – dann eben ohne */ }
      }
      // Früher gab es eine vorgefüllte Übungsliste — nie benutzte Einträge daraus entfernen
      const used = new Set();
      (data.workouts || []).forEach(w => (w.entries || []).forEach(e => used.add(e.exerciseId)));
      if (data.active) (data.active.entries || []).forEach(e => used.add(e.exerciseId));
      data.exercises = (data.exercises || []).filter(e => !/^ex\d+$/.test(e.id) || used.has(e.id));
      return migrate(data);
    }
  } catch (e) { /* beschädigte Daten → neu anfangen */ }
  return migrate({ exercises: [], workouts: [], templates: [], active: null });
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ============ Hilfsfunktionen ============ */
function exercise(id) {
  return state.exercises.find(e => e.id === id) || null;
}

function exName(id) {
  const ex = exercise(id);
  return ex ? ex.name : "Unbekannt";
}

function exNote(id) {
  const ex = exercise(id);
  return ex && ex.note ? ex.note : "";
}

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString("de-DE", {
    weekday: "short", day: "numeric", month: "long"
  });
}

function fmtDateShort(ts) {
  return new Date(ts).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" });
}

function fmtDuration(ms) {
  const totalMin = Math.round(ms / 60000);
  if (totalMin < 60) return totalMin + " Min.";
  return Math.floor(totalMin / 60) + " Std. " + (totalMin % 60) + " Min.";
}

function fmtWeight(w) {
  return (w % 1 === 0 ? w : w.toFixed(1).replace(".", ",")) + " kg";
}

function setsSummary(sets) {
  return sets.map(s => `${s.weight % 1 === 0 ? s.weight : String(s.weight).replace(".", ",")} kg × ${s.reps}`).join("  ·  ");
}

// Letzte Leistung für eine Übung aus abgeschlossenen Trainings finden
function lastPerformance(exerciseId) {
  const sorted = [...state.workouts].sort((a, b) => b.start - a.start);
  for (const w of sorted) {
    const entry = w.entries.find(e => e.exerciseId === exerciseId && e.sets.length > 0);
    if (entry) return { date: w.start, sets: entry.sets };
  }
  return null;
}

// Steigerungs-Empfehlung nach doppelter Progression (Ziel-Bereich: 8–12 Wdh.)
// Alle Sätze ≥ 12 Wdh. → Gewicht +2,5 % (auf 0,5 kg gerundet), zurück auf 8 Wdh.
// Sonst → gleiches Gewicht, eine Wiederholung mehr als der schwächste Satz.
function recommendation(exerciseId) {
  const last = lastPerformance(exerciseId);
  if (!last || !last.sets.length) return null;
  const sets = last.sets;
  const top = sets.reduce((m, s) => s.weight > m.weight ? s : m, sets[0]);
  const minReps = Math.min(...sets.map(s => s.reps));
  if (top.weight === 0) {
    return { text: `${minReps + 1} Wdh. pro Satz`, why: "Körpergewicht – Steigerung über Wiederholungen" };
  }
  if (sets.every(s => s.reps >= 12)) {
    let nw = Math.ceil((top.weight * 1.025) / 0.5) * 0.5;
    if (nw <= top.weight) nw = top.weight + 0.5;
    return { text: `${fmtWeight(nw)} × 8 Wdh.`, why: "alle Sätze ≥ 12 Wdh. → Zeit für mehr Gewicht (+2,5 %)" };
  }
  return { text: `${fmtWeight(top.weight)} × ${Math.min(minReps + 1, 12)} Wdh.`, why: "gleiches Gewicht, eine Wdh. mehr (Ziel: 12)" };
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

/* ============ Eigene Dialoge (statt Browser-Popups) ============ */
function dialog(message, buttons) {
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop dialog-backdrop";
    backdrop.innerHTML = `<div class="dialog">
      <div class="sys-badge">⟦ System ⟧</div>
      <p>${escapeHtml(message)}</p>
      <div class="dialog-buttons">
        ${buttons.map((b, i) => `<button class="btn ${b.cls}" data-i="${i}">${escapeHtml(b.label)}</button>`).join("")}
      </div>
    </div>`;
    backdrop.addEventListener("click", e => {
      const btn = e.target.closest("button[data-i]");
      if (btn) { backdrop.remove(); resolve(buttons[+btn.dataset.i].value); }
      else if (e.target === backdrop) { backdrop.remove(); resolve(false); }
    });
    document.body.appendChild(backdrop);
  });
}

function showAlert(msg) {
  return dialog(msg, [{ label: "OK", cls: "btn-primary", value: true }]);
}

function showConfirm(msg, okLabel = "Ja", danger = false) {
  return dialog(msg, [
    { label: "Abbrechen", cls: "btn-secondary", value: false },
    { label: okLabel, cls: danger ? "btn-danger" : "btn-primary", value: true }
  ]);
}

// Auflösung: null = abgebrochen, sonst der (ggf. leere) getrimmte Text.
function showPrompt(title, placeholder, value = "", opts = {}) {
  const multiline = !!opts.multiline;
  const hint = opts.hint ? `<p style="font-size:12.5px;color:var(--muted);text-align:left;margin:-4px 0 12px;line-height:1.45">${escapeHtml(opts.hint)}</p>` : "";
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop dialog-backdrop";
    const field = multiline
      ? `<textarea id="prompt-input" rows="4" placeholder="${escapeHtml(placeholder)}"></textarea>`
      : `<input type="text" id="prompt-input" placeholder="${escapeHtml(placeholder)}" autocomplete="off" autocapitalize="sentences">`;
    backdrop.innerHTML = `<div class="dialog">
      <h2>${escapeHtml(title)}</h2>
      ${hint}
      ${field}
      <div class="dialog-buttons">
        <button class="btn btn-secondary" data-v="cancel">Abbrechen</button>
        <button class="btn btn-primary" data-v="ok">Speichern</button>
      </div>
    </div>`;
    const input = backdrop.querySelector("#prompt-input");
    input.value = value || "";
    const done = v => { backdrop.remove(); resolve(v); };
    backdrop.addEventListener("click", e => {
      if (e.target === backdrop) { done(null); return; }
      const v = e.target.dataset ? e.target.dataset.v : null;
      if (v === "cancel") done(null);
      else if (v === "ok") done(input.value.trim());
    });
    if (!multiline) {
      input.addEventListener("keydown", e => { if (e.key === "Enter") done(input.value.trim()); });
    }
    document.body.appendChild(backdrop);
    input.focus();
    if (value) input.setSelectionRange(value.length, value.length);
  });
}

/* ============ Backup: sichern & wiederherstellen ============ */
function buildBackup() {
  const photos = {};
  photoCache.forEach((v, k) => { photos[k] = v; });
  return JSON.stringify({ app: "gym-tracker", version: DATA_VERSION, exported: Date.now(), state, photos });
}

function exportData() {
  const blob = new Blob([buildBackup()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `gym-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function importData() {
  document.getElementById("import-input").click();
}

async function handleImportFile(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "gym-tracker" || !data.state || !Array.isArray(data.state.workouts)) throw new Error("ungültig");
    const when = data.exported ? ` vom ${fmtDateShort(data.exported)}` : "";
    const ok = await showConfirm(
      `Backup${when} laden (${data.state.workouts.length} Training${data.state.workouts.length === 1 ? "" : "s"})? Deine aktuellen Daten werden dabei ersetzt.`,
      "Laden", true);
    if (!ok) return;
    state = migrate(data.state);
    save();
    photoCache.clear();
    Object.entries(data.photos || {}).forEach(([k, v]) => {
      photoCache.set(k, v);
      idbPutPhoto(k, v);
    });
    currentTab = "home";
    render();
    showAlert("Backup erfolgreich geladen ✓");
  } catch (e) {
    showAlert("Diese Datei ist leider kein gültiges Gym-Tracker-Backup.");
  }
}

/* ============ Übungs-Fotos (IndexedDB, da localStorage zu klein) ============ */
let photoDb = null;
const photoCache = new Map();

function openPhotoDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("gymtracker-photos", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("photos");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadPhotos() {
  try {
    photoDb = await openPhotoDb();
    await new Promise(resolve => {
      const cur = photoDb.transaction("photos").objectStore("photos").openCursor();
      cur.onsuccess = e => {
        const c = e.target.result;
        if (c) { photoCache.set(c.key, c.value); c.continue(); }
        else resolve();
      };
      cur.onerror = () => resolve();
    });
    if (photoCache.size) render();
  } catch (e) { /* Fotos sind optional – App läuft auch ohne */ }
}

function idbPutPhoto(key, val) {
  try { photoDb && photoDb.transaction("photos", "readwrite").objectStore("photos").put(val, key); } catch (e) {}
}
function idbDeletePhoto(key) {
  try { photoDb && photoDb.transaction("photos", "readwrite").objectStore("photos").delete(key); } catch (e) {}
}

// Foto verkleinern, damit der Speicher nicht überläuft
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 700;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error("Bild nicht lesbar")); };
    img.src = URL.createObjectURL(file);
  });
}

let photoTarget = null;

function pickPhoto(exerciseId) {
  photoTarget = exerciseId;
  document.getElementById("photo-input").click();
}

async function handlePhotoFile(file) {
  if (!file || !photoTarget) return;
  try {
    const dataUrl = await resizeImage(file);
    photoCache.set(photoTarget, dataUrl);
    idbPutPhoto(photoTarget, dataUrl);
    render();
  } catch (e) {
    showAlert("Das Foto konnte leider nicht verarbeitet werden.");
  }
}

function viewPhoto(exerciseId) {
  const src = photoCache.get(exerciseId);
  if (!src) { pickPhoto(exerciseId); return; }
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop dialog-backdrop";
  backdrop.innerHTML = `<div class="photo-viewer">
    <img src="${src}" alt="${escapeHtml(exName(exerciseId))}">
    <p style="text-align:center;font-weight:700;margin:10px 0 12px">${escapeHtml(exName(exerciseId))}</p>
    <div class="dialog-buttons">
      <button class="btn btn-secondary" data-act="change">Foto ändern</button>
      <button class="btn btn-danger" data-act="del">Löschen</button>
    </div>
  </div>`;
  backdrop.addEventListener("click", async e => {
    const act = e.target.dataset ? e.target.dataset.act : null;
    if (e.target === backdrop) backdrop.remove();
    else if (act === "change") { backdrop.remove(); pickPhoto(exerciseId); }
    else if (act === "del") {
      backdrop.remove();
      if (await showConfirm("Foto wirklich löschen?", "Löschen", true)) {
        photoCache.delete(exerciseId);
        idbDeletePhoto(exerciseId);
        render();
      }
    }
  });
  document.body.appendChild(backdrop);
}

/* ============ Übung umbenennen & Notizen ============ */
async function renameExercise(id) {
  const ex = exercise(id);
  if (!ex) return;
  const name = await showPrompt("Übung umbenennen", "Name der Übung", ex.name, {
    hint: "Der neue Name gilt überall – auch für alle bereits gespeicherten Trainings."
  });
  if (name === null || name === "" || name === ex.name) return;
  const clash = state.exercises.find(e =>
    e.id !== id && !e.archived && e.name.toLowerCase() === name.toLowerCase());
  if (clash) {
    showAlert(`„${clash.name}" gibt es schon. Wähle bitte einen anderen Namen.`);
    return;
  }
  ex.name = name;
  save();
  render();
}

async function editExerciseNote(id) {
  const ex = exercise(id);
  if (!ex) return;
  const note = await showPrompt("Notiz zur Übung", "z. B. Sitz Stufe 4, Griff eng, Fußstütze 2", ex.note || "", {
    multiline: true,
    hint: "Diese Notiz bleibt dauerhaft an der Übung und erscheint bei jedem Training. Leer lassen zum Löschen."
  });
  if (note === null) return;
  if (note) ex.note = note; else delete ex.note;
  save();
  render();
}

async function editEntryNote(ei) {
  const entry = state.active && state.active.entries[ei];
  if (!entry) return;
  const note = await showPrompt("Notiz für heute", "z. B. linke Schulter hat gezwickt", entry.note || "", {
    multiline: true,
    hint: "Gilt nur für dieses Training und erscheint später im Verlauf. Leer lassen zum Löschen."
  });
  if (note === null) return;
  if (note) entry.note = note; else delete entry.note;
  save();
  render();
}

/* ============ Navigation ============ */
let currentTab = "home";
let expandedWorkout = null;
let progressExercise = null;
let timerInterval = null;

document.getElementById("nav").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  currentTab = btn.dataset.tab;
  render(true);
});

// animate = true nur beim Tab-Wechsel, damit die Einblend-Animation
// nicht bei jeder kleinen Aktion (z. B. „+ Satz") erneut abspielt
function render(animate = false) {
  document.querySelectorAll("#nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === currentTab));
  const main = document.getElementById("main");
  main.classList.toggle("anim", animate);
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (currentTab === "home") main.innerHTML = state.active ? viewWorkout() : viewHome();
  else if (currentTab === "history") main.innerHTML = viewHistory();
  else main.innerHTML = viewProgress();
  if (currentTab === "home" && state.active) startTimer();
}

/* ============ Ansicht: Start ============ */
function viewHome() {
  const templates = state.templates || [];
  const tplHtml = templates.map(t => {
    const names = t.exerciseIds
      .filter(x => state.exercises.some(e => e.id === x && !e.archived))
      .map(exName).join(", ") || "Keine Übungen mehr vorhanden";
    return `
      <div class="card template-card" onclick="startFromTemplate('${t.id}')">
        <div class="tpl-info">
          <div class="history-date">▶ ${escapeHtml(t.name)}</div>
          <div class="history-meta tpl-names">${escapeHtml(names)}</div>
        </div>
        <button class="opt-del" onclick="event.stopPropagation();deleteTemplate('${t.id}')">✕</button>
      </div>`;
  }).join("");

  const recent = [...state.workouts].sort((a, b) => b.start - a.start).slice(0, 3);
  let recentHtml = "";
  if (recent.length) {
    recentHtml = `<div class="sys-h" style="margin:24px 0 8px">Letzte Einheiten</div>` +
      recent.map(w => `
        <div class="card" style="padding:12px 16px">
          <div class="history-date">${fmtDate(w.start)}</div>
          <div class="history-meta">${w.entries.length} Übungen · ${fmtDuration(w.end - w.start)}</div>
        </div>`).join("");
  }
  return `
    <div class="head-block">
      <div class="deco-kana">ステータス</div>
      <div class="sys-h">Status</div>
      <h1>Gym Tracker</h1>
      <p class="subtitle">Bereit für dein Training?</p>
    </div>
    ${tplHtml}
    <button class="btn btn-primary" onclick="startWorkout()">${templates.length ? "Freies Training starten" : "Training starten"}</button>
    ${recentHtml || `
      <div class="empty-state">
        <div class="big">💪</div>
        Noch keine Trainings.<br>Starte jetzt dein erstes!
      </div>`}
    <div class="backup-row">
      <button class="btn-link" onclick="exportData()">Daten sichern</button>
      <span style="color:var(--muted)">·</span>
      <button class="btn-link" onclick="importData()">Backup laden</button>
    </div>
  `;
}

function startWorkout() {
  state.active = { start: Date.now(), type: "strength", entries: [] };
  save();
  render();
}

function startFromTemplate(id) {
  const t = (state.templates || []).find(x => x.id === id);
  if (!t) return;
  state.active = {
    start: Date.now(),
    type: "strength",
    templateId: t.id,
    entries: t.exerciseIds
      .filter(x => state.exercises.some(e => e.id === x && !e.archived))
      .map(x => ({ exerciseId: x, sets: [] }))
  };
  save();
  render();
}

async function deleteTemplate(id) {
  const t = (state.templates || []).find(x => x.id === id);
  if (!t) return;
  if (!await showConfirm(`Vorlage „${t.name}" löschen? Deine Trainings im Verlauf bleiben erhalten.`, "Löschen", true)) return;
  state.templates = state.templates.filter(x => x.id !== id);
  save();
  render();
}

async function saveAsTemplate() {
  const w = state.active;
  if (!w || !w.entries.length) return;
  const name = await showPrompt("Vorlage speichern", "Name, z. B. Training A");
  if (!name) return;
  state.templates = state.templates || [];
  const existing = state.templates.find(t => t.name.toLowerCase() === name.toLowerCase());
  if (existing) {
    existing.exerciseIds = w.entries.map(e => e.exerciseId);
  } else {
    state.templates.push({ id: uid(), name, exerciseIds: w.entries.map(e => e.exerciseId) });
  }
  save();
  showAlert(`Vorlage „${name}" gespeichert ✓ Du findest sie auf der Startseite.`);
}

/* ============ Ansicht: Aktives Training ============ */
function viewWorkout() {
  const w = state.active;
  const entriesHtml = w.entries.map((entry, ei) => {
    const last = lastPerformance(entry.exerciseId);
    const lastHtml = last
      ? `<div class="last-time">Letztes Mal (${fmtDateShort(last.date)}): <strong>${setsSummary(last.sets)}</strong></div>`
      : `<div class="last-time">Erste Aufzeichnung für diese Übung 🎉</div>`;
    const rec = recommendation(entry.exerciseId);
    const recHtml = rec
      ? `<div class="recommend">
           <div class="rec-head">System-Hinweis</div>
           Heute: <strong>${rec.text}</strong><span class="rec-why"> – ${rec.why}</span>
         </div>`
      : "";

    const note = exNote(entry.exerciseId);
    const noteHtml = note
      ? `<div class="note note-ex" onclick="editExerciseNote('${entry.exerciseId}')">📌<span>${escapeHtml(note)}</span></div>`
      : `<button class="note note-ex empty" onclick="editExerciseNote('${entry.exerciseId}')">📌<span>Notiz zur Übung hinzufügen</span></button>`;

    const setsHtml = entry.sets.map((s, si) => `
      <div class="set-row">
        <div class="set-num">${si + 1}</div>
        <input type="text" inputmode="decimal" autocomplete="off" placeholder="kg"
          value="${s.weight === "" ? "" : String(s.weight).replace(".", ",")}"
          onchange="updateSet(${ei},${si},'weight',this.value)">
        <div class="set-x">×</div>
        <input type="text" inputmode="numeric" autocomplete="off" placeholder="Wdh."
          value="${s.reps ?? ""}" onchange="updateSet(${ei},${si},'reps',this.value)">
        <button class="set-del" onclick="deleteSet(${ei},${si})">✕</button>
      </div>`).join("");

    const dayNoteHtml = entry.note
      ? `<div class="note note-day" onclick="editEntryNote(${ei})">✎<span>${escapeHtml(entry.note)}</span></div>`
      : `<button class="note note-day empty" onclick="editEntryNote(${ei})">✎<span>Notiz für heute</span></button>`;

    const photo = photoCache.get(entry.exerciseId);
    const photoHtml = photo
      ? `<img class="ex-thumb" src="${photo}" alt="" onclick="viewPhoto('${entry.exerciseId}')">`
      : `<button class="ex-photo-btn" title="Foto der Maschine hinzufügen" onclick="pickPhoto('${entry.exerciseId}')">📷</button>`;

    return `
      <div class="card exercise-card">
        <div class="exercise-title">
          <div class="ex-title-left">
            ${photoHtml}
            <span>${escapeHtml(exName(entry.exerciseId))}</span>
          </div>
          <div class="ex-actions">
            <button class="icon-btn" title="Umbenennen" onclick="renameExercise('${entry.exerciseId}')">✏️</button>
            <button class="icon-btn" title="Übung entfernen" onclick="removeExercise(${ei})">✕</button>
          </div>
        </div>
        ${noteHtml}
        ${lastHtml}
        ${recHtml}
        ${entry.sets.length ? `<div class="set-labels"><span>Satz</span><span>Gewicht</span><span></span><span>Wdh.</span><span></span></div>` : ""}
        ${setsHtml}
        <button class="btn btn-ghost" style="width:auto;padding:8px 4px" onclick="addSet(${ei})">+ Satz hinzufügen</button>
        ${dayNoteHtml}
      </div>`;
  }).join("");

  return `
    <div class="workout-header">
      <div>
        <div class="sys-h">Quest aktiv</div>
        <h1 style="margin:0">Training läuft</h1>
      </div>
      <div class="timer" id="timer">0:00</div>
    </div>
    ${entriesHtml || `<div class="empty-state"><div class="big">💪</div>Füge deine erste Übung hinzu.</div>`}
    <button class="btn btn-secondary" style="margin-bottom:12px" onclick="openExercisePicker()">+ Übung hinzufügen</button>
    <button class="btn btn-primary" onclick="finishWorkout()">Training beenden ✓</button>
    ${w.entries.length ? `<button class="btn btn-ghost" onclick="saveAsTemplate()">Als Vorlage speichern</button>` : ""}
    <button class="btn btn-ghost" style="color:var(--red)" onclick="cancelWorkout()">Training verwerfen</button>
  `;
}

function startTimer() {
  const update = () => {
    const el = document.getElementById("timer");
    if (!el || !state.active) return;
    const s = Math.floor((Date.now() - state.active.start) / 1000);
    const m = Math.floor(s / 60);
    el.textContent = m >= 60
      ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`
      : `${m}:${String(s % 60).padStart(2, "0")}`;
  };
  update();
  timerInterval = setInterval(update, 1000);
}

function addSet(ei) {
  const entry = state.active.entries[ei];
  let weight = "", reps = "";
  if (entry.sets.length) {
    // Werte vom vorherigen Satz übernehmen
    const prev = entry.sets[entry.sets.length - 1];
    weight = prev.weight; reps = prev.reps;
  } else {
    // Werte vom letzten Training übernehmen
    const last = lastPerformance(entry.exerciseId);
    if (last && last.sets.length) {
      weight = last.sets[0].weight; reps = last.sets[0].reps;
    }
  }
  entry.sets.push({ weight, reps });
  save();
  render();
}

function updateSet(ei, si, field, value) {
  let num = parseFloat(String(value).replace(",", "."));
  if (!isNaN(num)) num = Math.abs(field === "reps" ? Math.round(num) : num);
  state.active.entries[ei].sets[si][field] = isNaN(num) ? "" : num;
  save();
}

function deleteSet(ei, si) {
  state.active.entries[ei].sets.splice(si, 1);
  save();
  render();
}

async function removeExercise(ei) {
  const entry = state.active.entries[ei];
  if (entry.sets.length && !await showConfirm(`„${exName(entry.exerciseId)}" wirklich entfernen?`, "Entfernen", true)) return;
  state.active.entries.splice(ei, 1);
  save();
  render();
}

async function finishWorkout() {
  const w = state.active;
  // Leere Sätze und Übungen ohne Sätze aussortieren
  const entries = w.entries
    .map(e => ({ ...e, sets: e.sets.filter(s => s.weight !== "" && s.reps !== "" && s.reps > 0) }))
    .filter(e => e.sets.length > 0);
  if (!entries.length) {
    showAlert("Trage erst mindestens einen Satz mit Gewicht und Wiederholungen ein.");
    return;
  }
  if (!await showConfirm("Training beenden und speichern?", "Beenden")) return;
  const saved = { id: uid(), start: w.start, end: Date.now(), type: "strength", entries };
  if (w.templateId) saved.templateId = w.templateId;
  state.workouts.push(saved);
  state.active = null;
  save();
  currentTab = "history";
  expandedWorkout = saved.id;
  render();
  celebrate(saved);
}

function celebrate(w) {
  const sets = w.entries.reduce((n, e) => n + e.sets.length, 0);
  const volume = Math.round(w.entries.reduce((v, e) => v + e.sets.reduce((x, s) => x + s.weight * s.reps, 0), 0));
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop dialog-backdrop";
  backdrop.innerHTML = `<div class="dialog">
    <div class="sys-badge">⟦ System ⟧</div>
    <div class="celebrate-emoji">🏆</div>
    <h2 style="text-align:center;font-size:13px;margin-bottom:10px">Quest abgeschlossen</h2>
    <p style="margin-bottom:14px">Stark! Das hast du heute geleistet:</p>
    <div class="stats-grid">
      <div class="stat"><div class="stat-val">${fmtDuration(w.end - w.start)}</div><div class="stat-label">Dauer</div></div>
      <div class="stat"><div class="stat-val">${w.entries.length}</div><div class="stat-label">Übungen</div></div>
      <div class="stat"><div class="stat-val">${sets}</div><div class="stat-label">Sätze</div></div>
      <div class="stat"><div class="stat-val">${volume.toLocaleString("de-DE")} kg</div><div class="stat-label">Gesamt bewegt</div></div>
    </div>
    <button class="btn btn-primary">Weiter</button>
  </div>`;
  backdrop.addEventListener("click", e => {
    if (e.target === backdrop || e.target.closest(".btn")) backdrop.remove();
  });
  document.body.appendChild(backdrop);
}

async function cancelWorkout() {
  if (!await showConfirm("Training wirklich verwerfen? Alle Eingaben gehen verloren.", "Verwerfen", true)) return;
  state.active = null;
  save();
  render();
}

/* ============ Übungs-Auswahl (Modal) ============ */
async function deleteExerciseFlow(id) {
  const ex = exercise(id);
  if (!ex) return;
  const used = state.workouts.some(w => w.entries.some(en => en.exerciseId === id));
  const msg = used
    ? `„${ex.name}" aus der Auswahl entfernen? Deine gespeicherten Trainings mit dieser Übung bleiben im Verlauf erhalten.`
    : `„${ex.name}" wirklich löschen?`;
  if (!await showConfirm(msg, "Entfernen", true)) return;
  if (used) {
    // Übung nur ausblenden, damit alte Trainings ihren Namen behalten
    ex.archived = true;
  } else {
    state.exercises = state.exercises.filter(x => x.id !== id);
    photoCache.delete(id);
    idbDeletePhoto(id);
  }
  save();
}

function openExercisePicker() {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal">
      <h2>Übung hinzufügen</h2>
      <input type="text" id="ex-search" placeholder="Name der Übung eingeben …" autocomplete="off">
      <div class="exercise-list" id="ex-list"></div>
    </div>`;
  backdrop.addEventListener("click", e => { if (e.target === backdrop) backdrop.remove(); });
  document.body.appendChild(backdrop);

  const search = backdrop.querySelector("#ex-search");
  const list = backdrop.querySelector("#ex-list");

  const renderList = () => {
    const q = search.value.trim().toLowerCase();
    const inWorkout = new Set(state.active.entries.map(e => e.exerciseId));
    const matches = state.exercises
      .filter(e => !e.archived && !inWorkout.has(e.id) && e.name.toLowerCase().includes(q))
      .sort((a, b) => a.name.localeCompare(b.name, "de"));
    let html = matches.map(e => {
      const last = lastPerformance(e.id);
      const photo = photoCache.get(e.id);
      return `<div class="exercise-option" data-id="${e.id}">
        ${photo ? `<img class="opt-thumb" src="${photo}" alt="">` : ""}
        <span>${escapeHtml(e.name)}
          ${last ? `<span class="opt-last">Letztes Mal: ${setsSummary(last.sets)}</span>` : ""}
          ${e.note ? `<span class="opt-note">📌 ${escapeHtml(e.note)}</span>` : ""}
        </span>
        <button class="opt-edit" data-rename="${e.id}" title="Umbenennen">✏️</button>
        <button class="opt-del" data-del="${e.id}" title="Übung löschen">✕</button>
      </div>`;
    }).join("");
    if (q && !state.exercises.some(e => !e.archived && e.name.toLowerCase() === q)) {
      html = `<button class="exercise-option create-new" data-create="1">+ „${escapeHtml(search.value.trim())}" neu erstellen</button>` + html;
    }
    list.innerHTML = html || `<div class="empty-state">Tippe oben den Namen ein,<br>um deine erste Übung anzulegen —<br>z. B. „Brustpresse 1".</div>`;
  };

  list.addEventListener("click", async e => {
    const ren = e.target.closest("[data-rename]");
    if (ren) {
      await renameExercise(ren.dataset.rename);
      renderList();
      return;
    }
    const del = e.target.closest("[data-del]");
    if (del) {
      await deleteExerciseFlow(del.dataset.del);
      renderList();
      return;
    }
    const btn = e.target.closest(".exercise-option");
    if (!btn) return;
    let id;
    if (btn.dataset.create) {
      const name = search.value.trim();
      id = uid();
      state.exercises.push({ id, name });
    } else {
      id = btn.dataset.id;
    }
    state.active.entries.push({ exerciseId: id, sets: [] });
    save();
    backdrop.remove();
    render();
  });

  search.addEventListener("input", renderList);
  renderList();
  search.focus();
}

/* ============ Ansicht: Verlauf ============ */
function viewHistory() {
  const sorted = [...state.workouts].sort((a, b) => b.start - a.start);
  if (!sorted.length) {
    return `<div class="sys-h">Archiv</div><h1>Verlauf</h1><p class="subtitle">Deine abgeschlossenen Trainings</p>
      <div class="empty-state"><div class="big">📅</div>Noch keine Trainings gespeichert.</div>`;
  }
  const items = sorted.map(w => {
    const expanded = expandedWorkout === w.id;
    const details = expanded ? `
      <div class="history-details">
        ${w.entries.map(e => `
          <div class="history-ex">
            <div class="history-ex-name">${escapeHtml(exName(e.exerciseId))}</div>
            <div class="history-ex-sets">${setsSummary(e.sets)}</div>
            ${e.note ? `<div class="history-ex-note">✎ ${escapeHtml(e.note)}</div>` : ""}
          </div>`).join("")}
        <button class="del-workout" onclick="event.stopPropagation();deleteWorkout('${w.id}')">Training löschen</button>
      </div>` : "";
    return `
      <div class="card history-item" onclick="toggleWorkout('${w.id}')">
        <div class="history-date">${fmtDate(w.start)}</div>
        <div class="history-meta">${w.entries.length} Übungen · ${w.entries.reduce((n, e) => n + e.sets.length, 0)} Sätze · ${fmtDuration(w.end - w.start)}</div>
        ${details}
      </div>`;
  }).join("");
  return `<div class="sys-h">Archiv</div><h1>Verlauf</h1><p class="subtitle">${sorted.length} Training${sorted.length === 1 ? "" : "s"} gespeichert</p>${items}`;
}

function toggleWorkout(id) {
  expandedWorkout = expandedWorkout === id ? null : id;
  render();
}

async function deleteWorkout(id) {
  if (!await showConfirm("Dieses Training endgültig löschen?", "Löschen", true)) return;
  state.workouts = state.workouts.filter(w => w.id !== id);
  save();
  render();
}

/* ============ Ansicht: Fortschritt ============ */
function viewProgress() {
  // Nur Übungen anzeigen, die schon in Trainings vorkommen
  const usedIds = new Set();
  state.workouts.forEach(w => w.entries.forEach(e => usedIds.add(e.exerciseId)));
  const used = state.exercises
    .filter(e => usedIds.has(e.id))
    .sort((a, b) => a.name.localeCompare(b.name, "de"));

  if (!used.length) {
    return `<div class="sys-h">Analyse</div><h1>Fortschritt</h1><p class="subtitle">Deine Entwicklung pro Übung</p>
      <div class="empty-state"><div class="big">📈</div>Sobald du Trainings abgeschlossen hast,<br>siehst du hier deine Steigerung.</div>`;
  }
  if (!progressExercise || !usedIds.has(progressExercise)) progressExercise = used[0].id;

  const options = used.map(e =>
    `<option value="${e.id}" ${e.id === progressExercise ? "selected" : ""}>${escapeHtml(e.name)}</option>`).join("");

  // Verlauf dieser Übung: pro Training der beste Satz (höchstes Gewicht)
  const history = [...state.workouts]
    .sort((a, b) => a.start - b.start)
    .map(w => {
      const entry = w.entries.find(e => e.exerciseId === progressExercise);
      if (!entry) return null;
      const best = entry.sets.reduce((m, s) => s.weight > m.weight ? s : m, entry.sets[0]);
      const volume = entry.sets.reduce((v, s) => v + s.weight * s.reps, 0);
      return { date: w.start, best, volume, sets: entry.sets };
    })
    .filter(Boolean);

  const maxWeight = Math.max(...history.map(h => h.best.weight));

  const rows = [...history].reverse().map(h => `
    <div class="progress-row">
      <span class="p-date">${fmtDateShort(h.date)}</span>
      <span>${setsSummary([h.best])}${h.best.weight === maxWeight ? ' <span class="best-badge">★ Bestwert</span>' : ""}</span>
    </div>`).join("");

  const photo = photoCache.get(progressExercise);
  const note = exNote(progressExercise);
  const infoHtml = (photo || note) ? `
    <div class="card" style="padding:12px 14px">
      <div style="display:flex;align-items:center;gap:12px">
        ${photo ? `<img class="ex-thumb" src="${photo}" alt="" onclick="viewPhoto('${progressExercise}')">` : ""}
        <span style="color:var(--muted);font-size:13.5px">${photo ? "Foto der Maschine – zum Vergrößern antippen" : escapeHtml(exName(progressExercise))}</span>
      </div>
      ${note ? `<div class="note note-ex" onclick="editExerciseNote('${progressExercise}')">📌<span>${escapeHtml(note)}</span></div>` : ""}
    </div>` : "";

  return `
    <div class="sys-h">Analyse</div>
    <h1>Fortschritt</h1>
    <p class="subtitle">Bester Satz pro Training</p>
    <select onchange="progressExercise=this.value;render()">${options}</select>
    ${infoHtml}
    ${history.length >= 2 ? `<div class="card chart-wrap">${chartSvg(history)}</div>` : ""}
    <div class="card">${rows}</div>
  `;
}

function chartSvg(history) {
  const W = 320, H = 140, pad = { l: 34, r: 12, t: 12, b: 24 };
  const weights = history.map(h => h.best.weight);
  let min = Math.min(...weights), max = Math.max(...weights);
  if (min === max) { min -= 5; max += 5; }
  const range = max - min;
  min -= range * 0.1; max += range * 0.1;

  const x = i => pad.l + (i / (history.length - 1)) * (W - pad.l - pad.r);
  const y = v => H - pad.b - ((v - min) / (max - min)) * (H - pad.t - pad.b);

  const points = history.map((h, i) => `${x(i).toFixed(1)},${y(h.best.weight).toFixed(1)}`).join(" ");
  const baseY = (H - pad.b).toFixed(1);
  const area = `${x(0).toFixed(1)},${baseY} ${points} ${x(history.length - 1).toFixed(1)},${baseY}`;
  const dots = history.map((h, i) => {
    const isLast = i === history.length - 1;
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(h.best.weight).toFixed(1)}" r="${isLast ? 5 : 3.5}"
      fill="var(--accent)" ${isLast ? 'stroke="#fff" stroke-width="1.5"' : ""}/>`;
  }).join("");

  const yTicks = [min + (max - min) * 0.1, (min + max) / 2, max - (max - min) * 0.1].map(v => {
    const val = Math.round(v);
    return `<text x="${pad.l - 6}" y="${(y(val) + 4).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">${val}</text>
      <line x1="${pad.l}" y1="${y(val).toFixed(1)}" x2="${W - pad.r}" y2="${y(val).toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>`;
  }).join("");

  const first = fmtDateShort(history[0].date);
  const last = fmtDateShort(history[history.length - 1].date);

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8b5cff"/><stop offset="1" stop-color="#4fd8ff"/>
      </linearGradient>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(79,216,255,0.30)"/><stop offset="1" stop-color="rgba(79,216,255,0)"/>
      </linearGradient>
    </defs>
    ${yTicks}
    <polygon points="${area}" fill="url(#areaGrad)"/>
    <polyline points="${points}" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${pad.l}" y="${H - 6}" fill="var(--muted)" font-size="10">${first}</text>
    <text x="${W - pad.r}" y="${H - 6}" fill="var(--muted)" font-size="10" text-anchor="end">${last}</text>
  </svg>`;
}

/* ============ Start ============ */
document.getElementById("photo-input").addEventListener("change", e => {
  const file = e.target.files[0];
  e.target.value = "";
  handlePhotoFile(file);
});

document.getElementById("import-input").addEventListener("change", e => {
  const file = e.target.files[0];
  e.target.value = "";
  handleImportFile(file);
});

render(true);
loadPhotos();
</script>
